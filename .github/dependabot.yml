version: 2

# Version-update lag policy (AQU-681): never take a release on the day it ships.
# `cooldown.default-days: 7` holds every ecosystem one week behind the latest
# published version — most malicious or broken fresh releases are caught and
# yanked within ~24h, so a week is the cheapest useful supply-chain buffer.
#
# This does NOT delay security fixes: GitHub applies `cooldown` to version
# updates only ("the cooldown option is only available for version updates, not
# security updates"), so Dependabot security updates still open immediately.
#
# `interval: monthly` + `open-pull-requests-limit: 2` are a separate, deliberate
# PR-volume control — the cooldown is a floor on a release's age, not a cap on
# how late a bump may land. Don't conflate the two when tuning either.

# agent-worker's npm deps and its Dockerfile base image ride ONE pull request.
# The Sandbox SDK client (@cloudflare/sandbox) and the container it drives
# (docker.io/cloudflare/sandbox:<version>-python) must be the exact same
# version: the SDK logs `version_mismatch` on startup otherwise, and
# agent-worker/test/runtime-policy.test.ts fails. An npm-only group bumped the
# SDK twice (0.7.0 -> 0.12.5, 0.12.5 -> 0.12.9) and left the Dockerfile behind
# both times, because a single-ecosystem PR cannot touch a Dockerfile.
# Cloudflare publishes both artifacts together and both entries share the same
# 7-day cooldown, so they resolve to the same release; if a PR ever pairs
# different versions, align them by hand before merging.
multi-ecosystem-groups:
  agent-worker:
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

updates:
  # Root SPA + shared packages (packages/*, worker/, scripts/)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
    ignore:
      # v9 is a full API rewrite (no useReactTable/getCoreRowModel root
      # exports); ~18 files still use the v8 API. Remove once a deliberate
      # migration lands.
      - dependency-name: "@tanstack/react-table"
        update-types:
          - "version-update:semver-major"
      # 4.3.0 bundles onnxruntime-web 1.31.0-dev, whose asyncify WASM is
      # 25.6 MiB. Workers static assets cap each file at 25 MiB, so the bump
      # (grouped into #927) failed every preview and deploy build with "Asset
      # too large". Held at 4.2.0 (22.5 MiB) until the build stops emitting
      # that file or a release brings it back under the limit.
      # `scripts/check-app-build.ts` fails `pnpm build` if it regresses.
      - dependency-name: "@huggingface/transformers"

  - package-ecosystem: npm
    directory: "/auth-worker"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      auth-worker-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/sync-worker"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      sync-worker-deps:
        patterns:
          - "*"

  # agent-worker has its own package-lock.json and was the one Worker no
  # ecosystem entry covered, so a CVE in its dependencies — it shares hono with
  # the other two — would have gone unflagged. Partially addresses OPS-6 of
  # docs/OPSEC-REVIEW-2026-08-10.md ("no dependency-vulnerability step in CI").
  #
  # Schedule and PR limit live on the `agent-worker` multi-ecosystem group
  # above; `patterns` replaces the old single-ecosystem `groups` entry.
  - package-ecosystem: npm
    directory: "/agent-worker"
    multi-ecosystem-group: agent-worker
    patterns:
      - "*"
    cooldown:
      default-days: 7

  # The Dockerfile's FROM tag. Dependabot keeps the `-python` suffix when it
  # picks a newer tag.
  - package-ecosystem: docker
    directory: "/agent-worker"
    multi-ecosystem-group: agent-worker
    patterns:
      - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      cargo-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
