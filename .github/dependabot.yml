version: 2
updates:
  # Root SPA + shared packages (packages/*, worker/, scripts/)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: "/auth-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      auth-worker-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/sync-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      sync-worker-deps:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
