# Adversarial Jev suite (smart-tests/adversarial). Advisory: never a merge
# or release gate.
#
# nightly: attacks the deployed dev build at 09:00 UTC and files Linear
#          Triage tickets. It does not affect the cut or the deploy.
#
# There is no per-PR job since 2026-11-27. From 2026-10-01 it ran 2,041
# times on pull requests (234 runner-hours). All 170 red checks were the
# harness saying nothing about the commit, and one attack
# (edit.two-agents-same-cell) made 93 of the 150 "failure found" comments,
# on unrelated PRs. The nightly reports the same attacks once a day, against
# one build, to one place.
#
# No job attacks a release preview or production: a release preview writes
# to the shared dev database, and a preview sync worker cannot call a
# preview auth worker.
#
# Repository secrets: ADVERSARIAL_USER_1..3 (username:password on dev
# storage; each account's email must be on the dev access list, see
# docs/security/preview-access.md), TYPESAFE_API_KEY, TEXT_MODEL_API_KEY. LINEAR_API_KEY lives only
# in the `adversarial-nightly` environment, restricted to the dev branch,
# so no pull-request workflow can read it.

name: Adversarial Jev

on:
  schedule:
    # 09:00 UTC daily, after the overnight dev merges settle.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Attack mode filter (condition, redteam, fuzz, or empty for all)
        type: string
        default: ""
      repeat_each:
        description: Repeats per attack
        type: string
        default: "1"
      canary_only:
        description: Run only the model-free health gate
        type: boolean
        default: false

permissions:
  contents: read

env:
  ADVERSARIAL_USER_1: ${{ secrets.ADVERSARIAL_USER_1 }}
  ADVERSARIAL_USER_2: ${{ secrets.ADVERSARIAL_USER_2 }}
  ADVERSARIAL_USER_3: ${{ secrets.ADVERSARIAL_USER_3 }}
  TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
  TYPESAFE_URL: ${{ vars.TYPESAFE_URL || 'https://openrouter.ai/api/alpha/decisions' }}
  TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'typesafe/jev-1.13' }}
  TEXT_MODEL_API_KEY: ${{ secrets.TEXT_MODEL_API_KEY }}
  TEXT_MODEL: ${{ vars.TEXT_MODEL || 'inception/mercury-2.5' }}
  # Always explicit: an unset base URL once sent the key to the wrong provider (#716).
  TEXT_MODEL_BASE_URL: ${{ vars.TEXT_MODEL_BASE_URL || 'https://openrouter.ai/api/v1' }}
  TEXT_MODEL_REASONING: ${{ vars.TEXT_MODEL_REASONING || 'none' }}

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: adversarial-nightly
    concurrency:
      group: adversarial-nightly
      cancel-in-progress: false
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - name: Install pinned Jev
        run: |
          python3 -m venv "$RUNNER_TEMP/smart-tools"
          "$RUNNER_TEMP/smart-tools/bin/pip" install uv==0.9.9
          "$RUNNER_TEMP/smart-tools/bin/uv" sync --project smart-tests --frozen
      - name: Attack dev
        env:
          MODE: ${{ inputs.mode }}
          REPEAT_EACH: ${{ inputs.repeat_each || '1' }}
          CANARY_ONLY: ${{ inputs.canary_only }}
        run: |
          args=(--target dev --repeat-each "$REPEAT_EACH")
          if [ -n "$MODE" ]; then args+=(--mode "$MODE"); fi
          if [ "$CANARY_ONLY" = "true" ]; then args+=(--canary-only); fi
          pnpm test:adversarial "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: adversarial-evidence-nightly
          path: smart-tests/results/adv-*
          retention-days: 14
