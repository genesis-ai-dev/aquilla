name: Delta sync (audio + users)

# Scheduled delta import of legacy-Codex projects from GitLab → Neon + R2.
# Content (orgs/teams/projects/cells) is NO LONGER migrated here — that's
# owned by the migrate daemon running continuously on the Linux box
# (scripts/migrate-daemon/), live since 2026-09-09. See docs/MIGRATE-DAEMON.md.
# This workflow still runs the two passes below, both delta (per-project
# HEAD-sha compared against the state persisted in R2, so unchanged projects
# are skipped without cloning):
#   1. USERS — D1 identity + GitLab org/team/project access.
#   2. AUDIO — every take copied R2→R2 (CopyObject, no egress) + cell_audio events.
# Idempotent end to end; safe to re-run.
#
# Lock coexistence: the migrate daemon holds a continuous R2 run lock while
# it's live, under the same key scripts/migrate-all.ts's content pass uses
# (they must stay mutually exclusive — both write source/target cell events).
# The audio pass below (--audio-fast --apply) acquires a SEPARATE lock key
# (_migrate/audio-fast.lock, see scripts/migrate-all.ts) so it no longer
# contends with the daemon's lease — audio-fast only does R2 CopyObject of
# take bytes + emits cell.audio.* events, disjoint from what the daemon
# writes for content. Without this the audio pass would fail every night
# with LockHeldError while the daemon holds the content lock continuously.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FRONTIER_USERNAME, FRONTIER_PASSWORD   GitLab creds (Frontier password grant), OR
#   FRONTIER_TOKEN, GITLAB_URL             GitLab token escape hatch (skips Frontier login)
#     NOTE: when BOTH sets are present the direct FRONTIER_TOKEN wins
#     (src/lib/migrate/gitlab/auth.ts resolveCredentialsFromEnv), so an expired
#     FRONTIER_TOKEN shadows a valid username/password. A "401 Unauthorized"
#     from GitLab names the path it used — rotate that secret (or delete
#     FRONTIER_TOKEN to fall through to the password grant).
#   FRONTIER_D1_ACCOUNT_ID                 account containing frontier-db-v2
#   FRONTIER_D1_DATABASE_ID                frontier-db-v2 database UUID
#   FRONTIER_D1_API_TOKEN                  API token scoped to D1 Read only
#   NEON_PG_HOST/DB/ROLE/PASSWORD          production Neon direct connection
#   SYNC_SECRET_KEY                        trusted ingest/upsert auth (prod sync-worker)
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY R2 S3 token (read LFS bucket, write snapshots, state,
#                                          and the _migrate/*.lock run lock every --apply takes)
#   DISCORD_WEBHOOK_URL                    channel webhook for the run report
# Optional:
#   R2_ACCOUNT_ID (defaults to the Frontier R&D account baked into the script)

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: delta-sync
  cancel-in-progress: false # never interrupt an in-flight sync (corrupts the delta state)

permissions:
  contents: read

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || '6a80496d1e59948a9cbaa3c643ba81d7' }}
  R2_BUCKET: aquilla-snapshots
  STATE_KEY: _migrate/audio-migrate-state.json
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID || '6a80496d1e59948a9cbaa3c643ba81d7' }}.r2.cloudflarestorage.com

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # migrate-users.ts imports auth-worker/src/** (frontier-d1, legacy-user-
      # migration → utils/password → bcryptjs). auth-worker is its own npm
      # package, not a pnpm workspace member, so the root install leaves its
      # node_modules empty and the users step died with ERR_MODULE_NOT_FOUND.
      - name: Install auth-worker deps (imported by migrate-users.ts)
        run: npm ci --prefix auth-worker

      # Restore the delta state (HEAD-sha-per-project, for audioFastSha) so
      # unchanged projects are skipped without cloning. Missing object →
      # first run → full sweep.
      - name: Restore migrate state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "s3://${R2_BUCKET}/${STATE_KEY}" .migrate-state.json \
            --endpoint-url "$R2_ENDPOINT" || echo "no prior state — full sweep"
          echo "state entries: $(grep -c audioFastSha .migrate-state.json 2>/dev/null || echo 0) audio"

      # 1) USERS: atomically import every safe D1-only identity together with
      #    its GitLab-derived org/team/project access.
      - name: User identity and access delta
        id: users
        timeout-minutes: 30
        env:
          FRONTIER_USERNAME: ${{ secrets.FRONTIER_USERNAME }}
          FRONTIER_PASSWORD: ${{ secrets.FRONTIER_PASSWORD }}
          FRONTIER_TOKEN: ${{ secrets.FRONTIER_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          FRONTIER_D1_ACCOUNT_ID: ${{ secrets.FRONTIER_D1_ACCOUNT_ID }}
          FRONTIER_D1_DATABASE_ID: ${{ secrets.FRONTIER_D1_DATABASE_ID }}
          FRONTIER_D1_API_TOKEN: ${{ secrets.FRONTIER_D1_API_TOKEN }}
          NEON_PG_HOST: ${{ secrets.NEON_PG_HOST }}
          NEON_PG_DB: ${{ secrets.NEON_PG_DB }}
          NEON_PG_ROLE: ${{ secrets.NEON_PG_ROLE }}
          NEON_PG_PASSWORD: ${{ secrets.NEON_PG_PASSWORD }}
        run: |
          set -o pipefail
          npx tsx scripts/migrate-users.ts --apply 2>&1 | tee users.log

      # 2) AUDIO: every take, copied R2→R2. Uses its own R2 run lock
      #    (_migrate/audio-fast.lock) so it never contends with the migrate
      #    daemon's continuous content-pass lock — see the coexistence note
      #    at the top of this file.
      - name: Audio delta
        id: audio
        if: always()
        timeout-minutes: 150
        env:
          FRONTIER_USERNAME: ${{ secrets.FRONTIER_USERNAME }}
          FRONTIER_PASSWORD: ${{ secrets.FRONTIER_PASSWORD }}
          FRONTIER_TOKEN: ${{ secrets.FRONTIER_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          # Drop noisy per-100 copy-progress lines; keep per-project results.
          npx tsx scripts/migrate-all.ts --audio-fast --apply 2>&1 \
            | grep -vE "copied [0-9]+/[0-9]+ +copied" | tee audio.log

      # Always push state back (even on failure) so partial progress isn't lost
      # and the next run resumes — the sync is idempotent.
      - name: Persist migrate state to R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -f .migrate-state.json ]; then
            aws s3 cp .migrate-state.json "s3://${R2_BUCKET}/${STATE_KEY}" \
              --endpoint-url "$R2_ENDPOINT"
          fi

      - name: Build report
        if: always()
        id: report
        run: |
          u=users.log; a=audio.log
          [ -f "$u" ] || echo "users.log missing — user pass did not produce output" > "$u"
          [ -f "$a" ] || echo "audio.log missing — audio pass did not produce output" > "$a"

          # ── users ──
          u_summary=$(tail -1 "$u")

          # ── audio ── (grep -c already prints 0 when no match; no `|| echo 0`)
          a_applied=$(grep -oE "Applied [0-9]+/[0-9]+ projects" "$a" | tail -1); [ -z "$a_applied" ] && a_applied="Applied ?/? (failed early)"
          a_changed=$(grep -cE "copied [0-9]+/[0-9]+.*\([0-9.]+s\)" "$a")
          a_copied=$(grep -oE "copied [0-9]+/[0-9]+.*\([0-9.]+s\)" "$a" | grep -oE "copied [0-9]+" | awk '{s+=$2} END{print s+0}')
          a_lfsmiss=$(grep -oE "lfs-miss [0-9]+" "$a" | awk '{s+=$2} END{print s+0}')
          a_errors=$(grep -cE "✗ " "$a")

          errors=$((a_errors))
          status="✅ ok"; [ "$errors" -gt 0 ] && status="⚠️ ${errors} errors"
          {
            echo "## Delta sync — ${status}"
            echo ""
            echo "### Users (D1 identity + GitLab access)"
            echo "\`${u_summary}\`"
            echo ""
            echo "### Audio (takes)"
            echo "| metric | value |"
            echo "|---|---|"
            echo "| ${a_applied} | |"
            echo "| projects with new audio | ${a_changed} |"
            echo "| takes copied | ${a_copied} |"
            echo "| lfs-miss | ${a_lfsmiss} |"
            echo "| audio errors | ${a_errors} |"
          } | tee "$GITHUB_STEP_SUMMARY"
          {
            echo "status=${status}"
            echo "a_applied=${a_applied}"
            echo "a_copied=${a_copied}"
            echo "errors=${errors}"
          } >> "$GITHUB_OUTPUT"

      # `secrets` can't be used in an `if:` — pass the webhook as env and guard in
      # the shell. All interpolated values are trusted (our own outputs +
      # github.run_id), never event data.
      - name: Post to Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_STATUS: ${{ steps.report.outputs.status }}
          R_AAPPLIED: ${{ steps.report.outputs.a_applied }}
          R_ACOPIED: ${{ steps.report.outputs.a_copied }}
          R_ERRORS: ${{ steps.report.outputs.errors }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "no DISCORD_WEBHOOK_URL secret — skipping"; exit 0; fi
          msg=$(printf '**Delta sync** — %s\nAudio: %s · %s takes copied\nerrors: %s\n<%s>' \
            "$R_STATUS" "$R_AAPPLIED" "$R_ACOPIED" "$R_ERRORS" "$RUN_URL")
          curl -fsS -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$msg" '{content:$c}')" \
            "$WEBHOOK" || echo "discord post failed (non-fatal)"
