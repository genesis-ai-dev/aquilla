name: CI

# Pull requests into dev run the test gate: lint, i18n:check, the secret scan,
# unit tests, worker tests, and pnpm neon:check. Cloudflare Workers Builds
# already compiles the preview (AQU-564), so a pull request does not repeat
# typecheck, the Vite build, Tauri, or the IDML browser suite. Those stay on
# workflow_dispatch.
#
# Branch protection on dev requires the jobs that always report a status on a
# pull request: lint, unit, schema-migrations, auth-worker-tests,
# sync-worker-tests, agent-worker-tests. `unit` aggregates the three
# `unit-shard` matrix jobs (AQU-1991), so that name is stable; `auth-worker-tests`
# and `sync-worker-tests` aggregate their own shards the same way. A
# path-filtered worker job reports success when that worker did not change. A
# skipped required check would block the pull request. The Cloudflare preview stays a
# separate required check. enforce_admins is false, so an admin can still merge
# around a red run.
#
# This workflow does not apply migrations. The nightly Neon refresh
# (dev-neon-refresh.yml) has not restored dev since 2026-09-29 — NEON_API_KEY was
# missing until 2026-10-15 and the stored value is rejected by the Neon API — and
# repairing that secret is separate.

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      wrangler_environment: ${{ steps.resolve.outputs.wrangler_environment }}
      live_environment: ${{ steps.resolve.outputs.live_environment }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      api_host: ${{ steps.resolve.outputs.api_host }}
      sync_worker_host: ${{ steps.resolve.outputs.sync_worker_host }}
      auth_base: ${{ steps.resolve.outputs.auth_base }}
      chat_base: ${{ steps.resolve.outputs.chat_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: resolve
        name: Resolve authorized deployment target
        run: bash scripts/resolve-deployment-target.sh

  # Path filters decide which worker suites execute. The jobs themselves always
  # report a status: an unchanged worker is a successful no-op, because a
  # skipped required check blocks branch protection. Detection fails open for
  # an unreadable diff and for every shared input that can affect more than
  # one Worker.
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      sync: ${{ steps.filter.outputs.sync }}
      agent: ${{ steps.filter.outputs.agent }}
      monitor: ${{ steps.filter.outputs.monitor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::No usable diff base; running every worker suite."
            node scripts/resolve-worker-test-scope.mjs --all
            exit 0
          fi

          if ! changed=$(git diff --name-only "$base" "$HEAD_SHA"); then
            echo "::notice::Diff failed; running every worker suite."
            node scripts/resolve-worker-test-scope.mjs --all
            exit 0
          fi
          echo "$changed"
          printf '%s\n' "$changed" | node scripts/resolve-worker-test-scope.mjs

  # Required branch-protection checks. Do not rename or add conditions without
  # updating the main/dev protection rules in the same control-plane change.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The three checks that take seconds run before ESLint, which takes 6 to
      # 11 minutes. A step that fails stops the job, so in the old order (ESLint
      # first) a failed ESLint run hid the secret scan's answer, and an i18n
      # failure was reported eight minutes after it was known (AQU-2792).
      - run: pnpm run scan:secrets
      # The branch's own English: context notes, retired words, catalog keys
      # English lacks. Not whether it is translated yet: i18n-fill.yml translates
      # after the merge, and `pnpm i18n:coverage` is the check it runs.
      - run: pnpm run i18n:check
      # Doc pins: every `path::symbol` claim in the docs still resolves (AQU-2387).
      - run: pnpm run check:doc-pins
      # `pnpm lint` runs ESLint with a 12 GiB heap cap (see the `lint` script in
      # package.json). V8's default ~4 GiB ceiling ran out on 2026-10-20 (AQU-2084):
      # the job died with "JavaScript heap out of memory", exit 134, on every PR.
      # The cap was 8 GiB until 2026-11-27, when ESLint failed the same way under
      # a 6 GiB cap and peaked at 7.05 GiB under a 7 GiB one (AQU-2792). The cap
      # is a ceiling, not an allocation; ubuntu-latest for this public repo has
      # 16 GB.
      - run: pnpm lint

  typecheck:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc -b` under the 6 GiB heap the `typecheck` script sets: the app project
      # no longer fits Node's default ~4 GiB ceiling with any room to spare.
      - run: pnpm run typecheck --noEmit

  # The root Vitest suite, split three ways (AQU-1991). One runner took 20-34
  # minutes for ~2,100 files; each shard takes a third of the test time plus a
  # minute of setup. `--shard` splits the sorted file list, so every file runs
  # exactly once across the three. Branch protection names `unit`, so the
  # `unit` job below aggregates the shards and keeps that name stable.
  unit-shard:
    name: unit (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test` is `vitest run`; the shard flag goes straight to vitest.
      - run: pnpm vitest run --shard=${{ matrix.shard }}/3
      # The worker/ suite is two files; one shard carries it.
      - if: matrix.shard == 1
        run: pnpm test:worker
      # IDML is a dispatch-only browser suite. A pull request does not run it.
      - uses: ./.github/actions/playwright-chromium
        if: github.event_name == 'workflow_dispatch' && matrix.shard == 1
      - if: github.event_name == 'workflow_dispatch' && matrix.shard == 1
        run: pnpm test:idml

  # Required check. Reports the shards' combined result under the name branch
  # protection expects; a skipped or cancelled shard fails it.
  unit:
    needs: unit-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every shard passed
        if: needs.unit-shard.result != 'success'
        run: |
          echo "unit-shard result: ${{ needs.unit-shard.result }}"
          exit 1
      - run: echo "All unit shards passed."

  tauri-unit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Same version as src-tauri/rust-toolchain.toml, so targets install on it.
          toolchain: "1.95"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test
        working-directory: src-tauri

  # The repository build is the CI gate (tsc -b && vite build). It compiles
  # once with the resolved target, verifies that target, and publishes the
  # exact dist/ directory consumed by deploy.
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: target
    runs-on: ubuntu-latest
    env:
      VITE_SYNC_WORKER_HOST: ${{ needs.target.outputs.sync_worker_host }}
      VITE_AUTH_BASE: ${{ needs.target.outputs.auth_base }}
      VITE_CHAT_BASE: ${{ needs.target.outputs.chat_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify built API environment
        run: bash scripts/verify-dist-host.sh "${{ needs.target.outputs.api_host }}"
      - name: Strip dist/_redirects (Workers static assets rejects it)
        run: rm -f dist/_redirects
      - name: Verify deployment artifact exclusion policy
        run: node scripts/verify-deployment-artifacts.mjs dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aquilla-web-${{ needs.target.outputs.live_environment }}-${{ github.sha }}
          path: dist
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  schema-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm neon:check

  # The auth-worker and sync-worker suites, each split across runners the way
  # `unit` is. Both run every test against a real in-process Postgres (PGlite),
  # so their time is CPU and one runner has four cores: on one runner each,
  # sync-worker took 36-56 minutes and auth-worker 17-27. A shard runs only
  # when its worker changed, so an unchanged worker costs no runner at all.
  # `--shard` splits the sorted file list, so every file runs exactly once.
  # Branch protection names `auth-worker-tests` and `sync-worker-tests`, so
  # the jobs of those names below aggregate the shards and always report.
  auth-worker-shard:
    name: auth-worker-tests (shard ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      # auth-worker typecheck imports sync-worker source, which imports
      # partyserver. That package is installed with sync-worker.
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      # The type-check reads the whole project; one shard carries it.
      - if: matrix.shard == 1
        run: pnpm run type-check
        working-directory: auth-worker
      # `pnpm test` is `vitest run`; the shard flag goes straight to vitest.
      - run: pnpm vitest run --shard=${{ matrix.shard }}/2
        working-directory: auth-worker

  # Required check. Reports the shards' combined result under the name branch
  # protection expects, or success when auth-worker did not change: a skipped
  # required check would block the pull request.
  auth-worker-tests:
    needs: [changes, auth-worker-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when worker scope did not resolve
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report success when auth-worker did not change
        if: needs.changes.result == 'success' && needs.changes.outputs.auth != 'true'
        run: echo "auth-worker did not change. Reporting success so a path-filter skip cannot block branch protection."
      - name: Fail unless every shard passed
        if: needs.changes.outputs.auth == 'true' && needs.auth-worker-shard.result != 'success'
        run: |
          echo "auth-worker-shard result: ${{ needs.auth-worker-shard.result }}"
          exit 1
      - if: needs.changes.outputs.auth == 'true'
        run: echo "All auth-worker shards passed."

  sync-worker-shard:
    name: sync-worker-tests (shard ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sync == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      # sync-worker typecheck and tests import auth-worker source
      # (checking/route.ts uses auth-worker/src/utils/password), which imports
      # bcryptjs and @noble/hashes. Those packages are installed with auth-worker.
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      # The type-check reads the whole project; one shard carries it.
      - if: matrix.shard == 1
        run: pnpm run type-check
        working-directory: sync-worker
      - run: pnpm vitest run --shard=${{ matrix.shard }}/3
        working-directory: sync-worker

  # Required check, as `auth-worker-tests` above.
  sync-worker-tests:
    needs: [changes, sync-worker-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when worker scope did not resolve
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report success when sync-worker did not change
        if: needs.changes.result == 'success' && needs.changes.outputs.sync != 'true'
        run: echo "sync-worker did not change. Reporting success so a path-filter skip cannot block branch protection."
      - name: Fail unless every shard passed
        if: needs.changes.outputs.sync == 'true' && needs.sync-worker-shard.result != 'success'
        run: |
          echo "sync-worker-shard result: ${{ needs.sync-worker-shard.result }}"
          exit 1
      - if: needs.changes.outputs.sync == 'true'
        run: echo "All sync-worker shards passed."

  agent-worker-tests:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when worker scope did not resolve
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report success when agent-worker did not change
        if: needs.changes.result == 'success' && needs.changes.outputs.agent != 'true'
        run: echo "agent-worker did not change. Reporting success so a path-filter skip cannot block branch protection."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.agent == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.agent == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-worker/package-lock.json
      - if: needs.changes.outputs.agent == 'true'
        run: npm ci
        working-directory: agent-worker
      - if: needs.changes.outputs.agent == 'true'
        run: npm run type-check
        working-directory: agent-worker
      - if: needs.changes.outputs.agent == 'true'
        run: npm test
        working-directory: agent-worker
      - if: needs.changes.outputs.agent == 'true'
        run: docker build --tag aquilla-agent-sandbox:ci .
        working-directory: agent-worker

  # Not a required check yet: add it to branch protection once it has run.
  monitor-worker-tests:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when worker scope did not resolve
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report success when monitor-worker did not change
        if: needs.changes.result == 'success' && needs.changes.outputs.monitor != 'true'
        run: echo "monitor-worker did not change. Reporting success so a path-filter skip cannot block branch protection."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.monitor == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.monitor == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monitor-worker/package-lock.json
      - if: needs.changes.outputs.monitor == 'true'
        run: npm ci
        working-directory: monitor-worker
      - if: needs.changes.outputs.monitor == 'true'
        run: npm run type-check
        working-directory: monitor-worker
      - if: needs.changes.outputs.monitor == 'true'
        run: npm test
        working-directory: monitor-worker

  # NOTE: there is intentionally no `preview` job here. PR previews are owned
  # by Cloudflare Workers Builds (scripts/cloudflare-pr-preview.mjs), not this
  # workflow — see the AQU-564 note at the top of this file. A prior `preview`
  # job gated on `github.event_name == 'pull_request'` carried
  # `deployments: write` / `pull-requests: write` and CLOUDFLARE_API_TOKEN
  # access. It was removed as dead weight so a future trigger change can't
  # silently resurrect an unaudited privileged job. [Pen test] Infra security
  # review, 2026-08-14.
