name: CI

# GitHub Actions no longer deploys anything. Cloudflare Workers Builds owns
# every deploy, one connection per Worker script:
#
#   main → aquilla-web / aquilla-identity / aquilla-sync-worker   (production)
#   dev  → aquilla-web-development / aquilla-dev-identity /
#          aquilla-sync-worker-dev                                (QA)
#
# Each connection has "builds for non-production branches" disabled, so only
# its own branch can ever touch its Workers. That is enforced in the Cloudflare
# dashboard, not here — see docs/DEPLOYMENT-ENVIRONMENTS.md.
#
# What is left for Actions is the one thing Cloudflare cannot do: gate a pull
# request before it merges. This repo exhausts its Actions allowance in about a
# week, so this workflow is deliberately frugal:
#
#   * pull_request only. No push trigger — a merge to dev or main would just
#     re-run checks the PR already ran, and Cloudflare re-runs type-check and
#     the worker suites before it deploys either environment.
#   * The three worker suites (~22 min combined) run only when their package
#     changed.
#
# DELIBERATELY NOT path-ignored: lint, typecheck, unit and build are required
# status checks on main and dev. GitHub never reports a job filtered out by a
# paths filter, so a docs-only PR would wait forever on a check that cannot run.

on:
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same PR rather than paying for both.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which worker packages did this PR touch? Same git-diff approach the old
  # deploy-workers.yml used, because the github.event.commits payload is
  # unreliable on merge and batch pushes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.f.outputs.auth }}
      sync: ${{ steps.f.outputs.sync }}
      agent: ${{ steps.f.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Fail OPEN: an undiffable base, or a change to shared root deps,
          # runs every suite. A skipped suite costs a broken deploy; a
          # redundant one costs nine minutes.
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::No usable diff base; running every worker suite."
            for w in auth sync agent; do echo "$w=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "$changed"

          if echo "$changed" | grep -qE '^(pnpm-lock\.yaml|package\.json|db/)'; then
            echo "::notice::Shared root dependency changed; running every worker suite."
            for w in auth sync agent; do echo "$w=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          echo "$changed" | grep -q '^auth-worker/'  && echo "auth=true"  >> "$GITHUB_OUTPUT" || echo "auth=false"  >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^sync-worker/'  && echo "sync=true"  >> "$GITHUB_OUTPUT" || echo "sync=false"  >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^agent-worker/' && echo "agent=true" >> "$GITHUB_OUTPUT" || echo "agent=false" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Required status checks: lint, typecheck, unit, build.
  # Branch protection on main and dev requires these exact context names.
  # Renaming one stops it reporting and makes every PR unmergeable — rename
  # only together with the protection settings.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # QW-6/TEST-6: lint enforced in CI
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:idml

  # AQU-219: must stay `pnpm run build` (the tsc -b chain), never
  # `tsc --noEmit` — a plain noEmit does NOT catch project-reference /
  # erasableSyntaxOnly violations (AQU-213 reached main before this existed).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  schema-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Static check: every table in schema.sql must have a CREATE TABLE in
      # db/postgres/migrations/ (or be in the pre-migration baseline set). No DB
      # connection required. Catches the ai_usage_daily class of drift, and is
      # the only place that runs before a Cloudflare build hits neon:status.
      - run: pnpm neon:check

  # ---------------------------------------------------------------------------
  # Worker suites — path-filtered. Not required status checks, so a skip here
  # cannot wedge a PR. Cloudflare re-runs these before it deploys either
  # environment; running them here catches breakage before the merge instead.
  # ---------------------------------------------------------------------------
  auth-worker-tests:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
      # Shared db shims live outside the worker dir and resolve their own bare
      # imports from the repo root.
      - run: pnpm install --frozen-lockfile
      # Worker-local install proves the worker package owns its direct deps.
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      - run: pnpm run type-check
        working-directory: auth-worker
      - run: pnpm test
        working-directory: auth-worker

  sync-worker-tests:
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - run: pnpm run type-check
        working-directory: sync-worker
      # TEST-1: sync-worker tests run in CI
      - run: pnpm test
        working-directory: sync-worker

  agent-worker-tests:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-worker/package-lock.json
      # Agent route tests inject a fake Sandbox binding, so PR validation does
      # not require Docker or another local container engine.
      - run: npm ci
        working-directory: agent-worker
      - run: npm run type-check
        working-directory: agent-worker
      - run: npm test
        working-directory: agent-worker
      # The route suite deliberately needs no container engine. Deployment does
      # build this image, though, so CI must prove the pinned SDK base and the
      # Python package layer still resolve.
      - run: docker build --tag aquilla-agent-sandbox:ci .
        working-directory: agent-worker
