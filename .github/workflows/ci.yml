name: CI

# Pull requests into dev run the test gate: lint, i18n:check, the secret scan,
# unit tests, worker tests, and pnpm neon:check. Cloudflare Workers Builds
# already compiles the preview (AQU-564), so a pull request does not repeat
# typecheck, the Vite build, Tauri, or the IDML browser suite. Those stay on
# workflow_dispatch.
#
# Branch protection on dev requires the jobs that always report a status on a
# pull request: lint, unit, schema-migrations, auth-worker-tests,
# sync-worker-tests, agent-worker-tests. A path-filtered worker job reports
# success when that worker did not change. A skipped required check would
# block the pull request. The Cloudflare preview stays a separate required
# check. enforce_admins is false, so an admin can still merge around a red run.
#
# This workflow does not apply migrations. The nightly Neon refresh is still
# broken — NEON_API_KEY has been missing since early September — and repairing
# that job is separate.

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      wrangler_environment: ${{ steps.resolve.outputs.wrangler_environment }}
      live_environment: ${{ steps.resolve.outputs.live_environment }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      api_host: ${{ steps.resolve.outputs.api_host }}
      sync_worker_host: ${{ steps.resolve.outputs.sync_worker_host }}
      auth_base: ${{ steps.resolve.outputs.auth_base }}
      chat_base: ${{ steps.resolve.outputs.chat_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: resolve
        name: Resolve authorized deployment target
        run: bash scripts/resolve-deployment-target.sh

  # Path filters decide which worker suites execute. The jobs themselves always
  # report a status: an unchanged worker is a successful no-op, because a
  # skipped required check blocks branch protection. Detection fails open for
  # an unreadable diff and for every shared input that can affect more than
  # one Worker.
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      sync: ${{ steps.filter.outputs.sync }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::No usable diff base; running every worker suite."
            node scripts/resolve-worker-test-scope.mjs --all
            exit 0
          fi

          if ! changed=$(git diff --name-only "$base" "$HEAD_SHA"); then
            echo "::notice::Diff failed; running every worker suite."
            node scripts/resolve-worker-test-scope.mjs --all
            exit 0
          fi
          echo "$changed"
          printf '%s\n' "$changed" | node scripts/resolve-worker-test-scope.mjs

  # Required branch-protection checks. Do not rename or add conditions without
  # updating the main/dev protection rules in the same control-plane change.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm run i18n:check
      - run: pnpm run scan:secrets

  typecheck:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Run worker coverage explicitly; pushes use affected browser tests.
      - run: pnpm test:worker
      # IDML is a dispatch-only browser suite. A pull request does not run it.
      - uses: ./.github/actions/playwright-chromium
        if: github.event_name == 'workflow_dispatch'
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm test:idml

  tauri-unit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test
        working-directory: src-tauri

  # The repository build is the CI gate (tsc -b && vite build). It compiles
  # once with the resolved target, verifies that target, and publishes the
  # exact dist/ directory consumed by deploy.
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: target
    runs-on: ubuntu-latest
    env:
      VITE_SYNC_WORKER_HOST: ${{ needs.target.outputs.sync_worker_host }}
      VITE_AUTH_BASE: ${{ needs.target.outputs.auth_base }}
      VITE_CHAT_BASE: ${{ needs.target.outputs.chat_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify built API environment
        run: bash scripts/verify-dist-host.sh "${{ needs.target.outputs.api_host }}"
      - name: Strip dist/_redirects (Workers static assets rejects it)
        run: rm -f dist/_redirects
      - name: Verify deployment artifact exclusion policy
        run: node scripts/verify-deployment-artifacts.mjs dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aquilla-web-${{ needs.target.outputs.live_environment }}-${{ github.sha }}
          path: dist
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  schema-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm neon:check

  auth-worker-tests:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when worker scope did not resolve
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report success when auth-worker did not change
        if: needs.changes.result == 'success' && needs.changes.outputs.auth != 'true'
        run: echo "auth-worker did not change. Reporting success so a path-filter skip cannot block branch protection."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.auth == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.auth == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.auth == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
      - if: needs.changes.outputs.auth == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.auth == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      # auth-worker typecheck imports sync-worker source, which imports
      # partyserver. That package is installed with sync-worker.
      - if: needs.changes.outputs.auth == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - if: needs.changes.outputs.auth == 'true'
        run: pnpm run type-check
        working-directory: auth-worker
      - if: needs.changes.outputs.auth == 'true'
        run: pnpm test
        working-directory: auth-worker

  sync-worker-tests:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when worker scope did not resolve
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report success when sync-worker did not change
        if: needs.changes.result == 'success' && needs.changes.outputs.sync != 'true'
        run: echo "sync-worker did not change. Reporting success so a path-filter skip cannot block branch protection."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.sync == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.sync == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.sync == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
      - if: needs.changes.outputs.sync == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.sync == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - if: needs.changes.outputs.sync == 'true'
        run: pnpm run type-check
        working-directory: sync-worker
      - if: needs.changes.outputs.sync == 'true'
        run: pnpm test
        working-directory: sync-worker

  agent-worker-tests:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when worker scope did not resolve
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report success when agent-worker did not change
        if: needs.changes.result == 'success' && needs.changes.outputs.agent != 'true'
        run: echo "agent-worker did not change. Reporting success so a path-filter skip cannot block branch protection."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.agent == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.agent == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-worker/package-lock.json
      - if: needs.changes.outputs.agent == 'true'
        run: npm ci
        working-directory: agent-worker
      - if: needs.changes.outputs.agent == 'true'
        run: npm run type-check
        working-directory: agent-worker
      - if: needs.changes.outputs.agent == 'true'
        run: npm test
        working-directory: agent-worker
      - if: needs.changes.outputs.agent == 'true'
        run: docker build --tag aquilla-agent-sandbox:ci .
        working-directory: agent-worker

  # NOTE: there is intentionally no `preview` job here. PR previews are owned
  # by Cloudflare Workers Builds (scripts/cloudflare-pr-preview.mjs), not this
  # workflow — see the AQU-564 note at the top of this file. A prior `preview`
  # job gated on `github.event_name == 'pull_request'` carried
  # `deployments: write` / `pull-requests: write` and CLOUDFLARE_API_TOKEN
  # access. It was removed as dead weight so a future trigger change can't
  # silently resurrect an unaudited privileged job. [Pen test] Infra security
  # review, 2026-08-14.
