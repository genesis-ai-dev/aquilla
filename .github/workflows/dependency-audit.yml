name: Dependency audit

# OPS-6. Deliberately NOT a pull-request gate.
#
# A per-PR advisory check fails on advisories in tooling the PR author did not
# touch and cannot fix, and the learned response to that is to ignore the lane —
# which is how the repo ended up with a live XSS advisory in its own HTML
# sanitizer for a day. A weekly scheduled run puts the finding in front of a
# maintainer at a moment when acting on it is the only thing being asked.
#
# The job is red only for advisories that are NOT in .github/audit-allowlist.json,
# so "still red" always means "something new arrived", never "the usual noise".
# See scripts/audit-deps.mjs.
#
# This audit replaced Dependabot version updates. Upgrades are now done by hand
# in a pull request that cites docs/DEPENDENCY-RULES.md. A failure used to show
# only as a red run in the Actions tab (it went unread for five weeks), so each
# scheduled run now files one Linear ticket per (directory, package) in Triage,
# via scripts/audit-tickets.ts. It reuses the Jev nightly's Linear client and
# fingerprint marker: an existing ticket is updated when its advisory set
# changes, and never moved, reopened or closed. Held packages get the HITL
# label (the list is read from docs/DEPENDENCY-RULES.md).
#
# LINEAR_API_KEY lives only in the `adversarial-nightly` environment, which is
# restricted to the dev branch, so the job runs in that environment and no new
# secret exists. Scheduled runs come from the default branch (dev), so the
# branch rule passes. A manual run must also be started from dev, and files
# tickets only with the `file_tickets` input; otherwise it prints what it would
# file to the step summary.

on:
  schedule:
    # Mondays 09:00 UTC — a working morning rather than a weekend backlog.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      file_tickets:
        description: "File Linear tickets (default: dry run, print only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: adversarial-nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      # The audits read lockfiles, not node_modules, so they need no install,
      # and an unrelated install failure cannot make them look like advisories.
      # Only the ticket step further down installs, for tsx.
      #
      # Each audit step uses continue-on-error so that both run and the ticket
      # step can see both outcomes. The last step fails the job.
      - name: Audit production dependencies
        id: node-audit
        continue-on-error: true
        env:
          AUDIT_REPORT_JSON: ${{ runner.temp }}/audit-report.json
        run: node scripts/audit-deps.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Same version as src-tauri/rust-toolchain.toml, so targets install on it.
          toolchain: "1.95"
      # Pinned to 0.22.2, the newest release that is more than a week old (the
      # same one-week lag the old Dependabot cooldown used).
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies (src-tauri)
        id: cargo-audit
        continue-on-error: true
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo audit --json > "$RUNNER_TEMP/cargo-audit.json"
      - name: Install tooling for the ticket step
        if: ${{ always() }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Tickets are filed only by scheduled runs, or by a manual run that sets
      # file_tickets. Everything else is a dry run.
      - name: File Linear tickets
        if: ${{ always() && steps.node-audit.outcome != 'skipped' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          FILE_TICKETS: ${{ github.event_name == 'schedule' || inputs.file_tickets }}
        run: |
          flags=(--report "$RUNNER_TEMP/audit-report.json" --cargo "$RUNNER_TEMP/cargo-audit.json")
          if [ "$FILE_TICKETS" != "true" ]; then flags+=(--dry-run); fi
          pnpm exec tsx scripts/audit-tickets.ts "${flags[@]}"
      - name: Upload the machine-readable report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audit-report
          path: ${{ runner.temp }}/audit-report.json
          if-no-files-found: ignore
      - name: Fail the job if either audit failed
        if: ${{ always() && (steps.node-audit.outcome == 'failure' || steps.cargo-audit.outcome == 'failure') }}
        run: exit 1
