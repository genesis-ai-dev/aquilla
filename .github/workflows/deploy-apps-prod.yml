name: Deploy apps to production

# Push to main → matrix-deploy each populated app under apps/* with
# `wrangler deploy --env=production`. Mirrors deploy-all-apps.yml's
# discovery + matrix structure but for prod, not per-PR previews.
#
# Currently skips:
#   - apps/front-door — uses a wildcard `aquilla.app/*` route claim and
#                       depends on a careful manual review for changes.
#                       Deploy it explicitly via `workflow_dispatch app=front-door`
#                       or invoke wrangler manually. This skip is conservative
#                       (front-door is the apex catch-all) and may be lifted
#                       once front-door changes are routinely safe.
#
# This workflow handles every other app under apps/*. SPA apps
# (billing, export, import, login, migrate, org, projects, reset,
# signup, workspace) get a `pnpm build` to produce dist/ before deploy;
# non-SPA workers (identity, sync, chat) skip the build step.
#
# `pnpm build` runs per-app before `wrangler deploy` (the Worker's
# [assets] binding requires dist/ to exist). The route claim in each
# wrangler.toml `[env.production]` makes Workers Routes dispatch
# `aquilla.app/<slug>/*` to the worker — Pages keeps serving everything
# else.

on:
  push:
    branches: [main]
    paths:
      - 'apps/billing/**'
      - 'apps/chat/**'
      - 'apps/export/**'
      - 'apps/identity/**'
      - 'apps/import/**'
      - 'apps/login/**'
      - 'apps/migrate/**'
      - 'apps/org/**'
      - 'apps/projects/**'
      - 'apps/reset/**'
      - 'apps/signup/**'
      - 'apps/sync/**'
      - 'apps/workspace/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-apps-prod.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy (all, or a single slug like "projects")'
        required: false
        default: 'all'

concurrency:
  group: deploy-apps-prod
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Build deploy matrix
        id: matrix
        run: |
          set -euo pipefail
          # Every app under apps/* except front-door (still gated behind
          # the Pages-retirement step).
          all=(billing chat export identity import login migrate org projects reset signup sync workspace)
          requested='${{ github.event.inputs.app }}'
          if [ -n "$requested" ] && [ "$requested" != "all" ]; then
            # workflow_dispatch with a single slug → only that app.
            json=$(printf '%s\n' "$requested" | jq -R . | jq -s -c .)
          else
            json=$(printf '%s\n' "${all[@]}" | jq -R . | jq -s -c .)
          fi
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  deploy-app:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (identity only)
        # Identity owns the aquilla-db schema. Migrations don't run as a
        # side effect of `wrangler deploy`; they require an explicit
        # `wrangler d1 migrations apply`. We do it BEFORE the worker
        # deploy so the new worker code never serves traffic against an
        # older schema.
        #
        # Idempotent — wrangler checks d1_migrations and only applies
        # the pending files. Non-interactive (no TTY in CI), so wrangler
        # auto-confirms.
        if: matrix.app == 'identity'
        working-directory: apps/identity
        run: pnpm exec wrangler d1 migrations apply aquilla-db --remote

      - name: Build app
        # Non-SPA workers (identity, sync, chat) skip the Vite build —
        # they don't ship a dist/ for Workers Assets to bind.
        if: matrix.app != 'identity' && matrix.app != 'sync' && matrix.app != 'chat'
        run: pnpm --filter @aquilla/${{ matrix.app }} build
        env:
          # Identity is mounted at aquilla.app/api/identity/* via Workers
          # Routes; the SPAs hit it through the apex. Sync + chat are
          # still on workers.dev (no public path mount yet).
          VITE_AUTH_BASE: https://aquilla.app/api/identity
          VITE_SYNC_WORKER_HOST: aquilla-sync-worker.blue-darkness-7674.workers.dev
          VITE_CHAT_BASE: https://aquilla-chat-worker.blue-darkness-7674.workers.dev

      - name: Deploy
        working-directory: apps/${{ matrix.app }}
        run: |
          # The production route claims already exist in Cloudflare. The CI
          # token can upload Workers/assets, but it intentionally does not
          # have zone route mutation permission, so strip route declarations
          # from the temporary checkout before deploying.
          perl -0pi -e 's/^\s*routes\s*=.*\n//mg' wrangler.toml
          pnpm exec wrangler deploy --env=production

      - name: Smoke-test prod URL
        # Skip for workers that don't have a public path mount yet
        # (sync, chat are still on their workers.dev URLs).
        if: matrix.app != 'sync' && matrix.app != 'chat'
        run: |
          slug='${{ matrix.app }}'
          path=$(jq -r --arg slug "$slug" '.[$slug] // empty' routes.json)
          if [ -z "$path" ]; then
            path="/${slug}"
          fi
          [ "${path%/}" = "$path" ] && path="${path}/"
          url="https://aquilla.app${path}"
          echo "Smoke-testing $url"
          # Workers Routes propagation can take a few seconds after deploy.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            echo "  attempt $attempt: HTTP $code"
            case "$code" in
              2*|3*|401|403)
                echo "::notice::$slug is live ($code)"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::Smoke test failed for $slug (HTTP $code) after retries"
          exit 1
