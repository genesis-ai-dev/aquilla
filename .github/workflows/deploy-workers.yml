name: Deploy Workers

# Branch → environment mapping:
#   push to main    → wrangler deploy              → prod workers
#   push to staging → wrangler deploy --env=staging → staging workers (staging.aquilla.app)
#   push to dev     → wrangler deploy --env=development → dev workers (dev.aquilla.app)
#
# Each worker only runs if its directory changed in the push (path filter) or
# if invoked explicitly via workflow_dispatch.
#
# DEVEX-1: deploy steps are ordered after their test steps in the same job,
# so tests must pass before wrangler deploy runs.

on:
  push:
    branches: [main, staging, dev]
    paths:
      - 'sync-worker/**'
      - 'auth-worker/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which worker to deploy (all, sync-worker, auth-worker)'
        required: false
        default: 'all'

jobs:
  # Reliable change detection. The old per-job `contains(toJSON(
  # github.event.commits.*.modified), 'sync-worker/')` guard silently
  # evaluated false (truncated/empty `commits` payloads, merge/batch
  # pushes), so worker deploys were skipped even when the worker changed.
  # Diff the actual push range instead.
  detect:
    runs-on: ubuntu-latest
    outputs:
      sync: ${{ steps.f.outputs.sync }}
      auth: ${{ steps.f.outputs.auth }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            w="${{ github.event.inputs.worker }}"
            [ "$w" = "all" ] || [ "$w" = "sync-worker" ] && echo "sync=true" >> "$GITHUB_OUTPUT" || echo "sync=false" >> "$GITHUB_OUTPUT"
            [ "$w" = "all" ] || [ "$w" = "auth-worker" ] && echo "auth=true" >> "$GITHUB_OUTPUT" || echo "auth=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${{ github.sha }}~1"
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" || git show --name-only --format= "${{ github.sha }}")
          echo "$changed" | grep -q '^sync-worker/' && echo "sync=true" >> "$GITHUB_OUTPUT" || echo "sync=false" >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^auth-worker/' && echo "auth=true" >> "$GITHUB_OUTPUT" || echo "auth=false" >> "$GITHUB_OUTPUT"

  # Worker deploys are blocked until the target Neon schema is current — the
  # recurring 500 class (FRO-135/150/158, projects.is_active/source_link_*) was
  # worker code referencing columns whose migration was never applied to Neon.
  # `neon-migrate status` is read-only: it checks the schema_migrations ledger
  # and diffs db/postgres/schema.sql against live information_schema. On a
  # failure, apply pending migrations from a laptop (npm run neon:apply) and
  # re-run the deploy. Requires target-specific NEON_*_PG_* repo secrets for
  # dev/staging and NEON_PG_* for production; fails closed if they're missing.
  schema-guard:
    needs: detect
    if: needs.detect.outputs.sync == 'true' || needs.detect.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check target Neon schema is current
        env:
          NEON_PG_HOST: ${{ secrets.NEON_PG_HOST }}
          NEON_PG_DB: ${{ secrets.NEON_PG_DB }}
          NEON_PG_ROLE: ${{ secrets.NEON_PG_ROLE }}
          NEON_PG_PASSWORD: ${{ secrets.NEON_PG_PASSWORD }}
          NEON_STAGING_PG_HOST: ${{ secrets.NEON_STAGING_PG_HOST }}
          NEON_STAGING_PG_DB: ${{ secrets.NEON_STAGING_PG_DB }}
          NEON_STAGING_PG_ROLE: ${{ secrets.NEON_STAGING_PG_ROLE }}
          NEON_STAGING_PG_PASSWORD: ${{ secrets.NEON_STAGING_PG_PASSWORD }}
          NEON_DEV_PG_HOST: ${{ secrets.NEON_DEV_PG_HOST }}
          NEON_DEV_PG_DB: ${{ secrets.NEON_DEV_PG_DB }}
          NEON_DEV_PG_ROLE: ${{ secrets.NEON_DEV_PG_ROLE }}
          NEON_DEV_PG_PASSWORD: ${{ secrets.NEON_DEV_PG_PASSWORD }}
        run: |
          case "${GITHUB_REF_NAME}" in
            main) pnpm neon:status:prod ;;
            staging) pnpm neon:status:staging ;;
            *) pnpm neon:status:dev ;;
          esac

  sync-worker:
    # !failure() && !cancelled(): run only when schema-guard passed, never when
    # it failed or was cancelled.
    needs: [detect, schema-guard]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.sync == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml

      # Shared db shims live outside the worker dir and resolve their own bare imports from the repo root.
      - run: pnpm install --frozen-lockfile

      # Worker-local install keeps worker package dependencies explicit before type-check/test/deploy.
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker

      - name: Type-check sync-worker
        run: pnpm run type-check
        working-directory: sync-worker

      # TEST-1/QW-5: sync-worker tests gate the deploy (DEVEX-1: tests before deploy)
      - name: Test sync-worker
        run: pnpm test
        working-directory: sync-worker

      - name: Deploy sync-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: sync-worker
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || github.ref == 'refs/heads/staging' && '--env=staging' || '--env=development' }}

  auth-worker:
    needs: [detect, schema-guard]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml

      # Shared db shims live outside the worker dir and resolve their own bare imports from the repo root.
      - run: pnpm install --frozen-lockfile

      # Worker-local install keeps worker package dependencies explicit before type-check/test/deploy.
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker

      - name: Type-check auth-worker
        run: pnpm run type-check
        working-directory: auth-worker

      # DEVEX-1: tests run before deploy, gating it
      - name: Test auth-worker
        run: pnpm test
        working-directory: auth-worker

      # NOTE: Postgres (Neon) is the only datastore — the D1→Neon cutover is
      # complete. Schema changes are applied by hand against Neon, NOT in CI
      # (npm run neon:apply, which records them in the schema_migrations
      # ledger). The schema-guard job above fails this deploy if the target
      # schema is behind db/postgres/migrations/.
      - name: Deploy auth-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: auth-worker
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || github.ref == 'refs/heads/staging' && '--env=staging' || '--env=development' }}
