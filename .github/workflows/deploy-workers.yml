name: Deploy Workers

# Branch → environment mapping:
#   push to main → wrangler deploy           → prod workers
#   push to dev  → wrangler deploy --env=staging → staging workers (-staging suffix)
#
# Each worker only runs if its directory changed in the push (path filter) or
# if invoked explicitly via workflow_dispatch.

on:
  push:
    branches: [main, dev]
    paths:
      - 'sync-worker/**'
      - 'apps/frontier-server/**'
      - 'chat-worker/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which worker to deploy (all, sync-worker, frontier-server, chat-worker)'
        required: false
        default: 'all'

jobs:
  sync-worker:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.worker == 'all' || github.event.inputs.worker == 'sync-worker')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.modified), 'sync-worker/')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.added), 'sync-worker/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json
      - run: npm ci
        working-directory: sync-worker
      - name: Deploy sync-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: sync-worker
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || '--env=staging' }}

  frontier-server:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.worker == 'all' || github.event.inputs.worker == 'frontier-server')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.modified), 'apps/frontier-server/')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.added), 'apps/frontier-server/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontier-server/package-lock.json
      - run: npm ci
        working-directory: apps/frontier-server
      - name: Type-check frontier-server
        run: npm run type-check
        working-directory: apps/frontier-server
      - name: Test frontier-server
        run: npm test
        working-directory: apps/frontier-server
      - name: Deploy frontier-server
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: apps/frontier-server
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || '--env=staging' }}

  chat-worker:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.worker == 'all' || github.event.inputs.worker == 'chat-worker')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.modified), 'chat-worker/')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.added), 'chat-worker/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - run: npm ci
        working-directory: chat-worker
      - name: Type-check chat-worker
        run: npm run type-check
        working-directory: chat-worker
      - name: Test chat-worker
        run: npm test
        working-directory: chat-worker
      - name: Deploy chat-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: chat-worker
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || '--env=staging' }}
