name: Deploy Workers

# Branch → environment mapping:
#   push to main → wrangler deploy           → prod workers
#   push to dev  → wrangler deploy --env=staging → staging workers (-staging suffix)
#
# Each worker only runs if its directory changed in the push (path filter) or
# if invoked explicitly via workflow_dispatch.

on:
  push:
    branches: [main, dev]
    paths:
      - 'sync-worker/**'
      - 'auth-worker/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which worker to deploy (all, sync-worker, auth-worker)'
        required: false
        default: 'all'

jobs:
  sync-worker:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.worker == 'all' || github.event.inputs.worker == 'sync-worker')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.modified), 'sync-worker/')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.added), 'sync-worker/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json
      - run: npm ci
        working-directory: sync-worker
      - name: Deploy sync-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: sync-worker
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || '--env=staging' }}

  auth-worker:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.worker == 'all' || github.event.inputs.worker == 'auth-worker')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.modified), 'auth-worker/')
      || github.event_name == 'push' && contains(toJSON(github.event.commits.*.added), 'auth-worker/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-worker/package-lock.json
      - run: npm ci
        working-directory: auth-worker
      - name: Type-check auth-worker
        run: npm run type-check
        working-directory: auth-worker
      - name: Test auth-worker
        run: npm test
        working-directory: auth-worker
      - name: Apply D1 migrations (auth-worker owns aquilla-db schema)
        # auth-worker owns the aquilla-db schema. Migrations don't run as a
        # side effect of `wrangler deploy`; they require an explicit
        # `wrangler d1 migrations apply`. Run BEFORE the worker deploys so
        # the new code never serves traffic against an older schema.
        # Idempotent — wrangler only applies pending files. Auto-confirms.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: auth-worker
          command: >-
            d1 migrations apply aquilla-db --remote
            ${{ github.ref == 'refs/heads/main' && '' || '--env=staging' }}
      - name: Deploy auth-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          workingDirectory: auth-worker
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || '--env=staging' }}

