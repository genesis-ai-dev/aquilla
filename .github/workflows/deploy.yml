name: Deploy aquilla-web Worker

# Deploys the aquilla brand of the SPA to the `aquilla-web` Cloudflare Worker
# (Workers with static assets). Replaces the former `codex-web` Pages deploy.
#
# When builds happen:
#   push to main / dev       → live deploy of that branch's environment
#   PR (non-draft)           → preview upload, on open/reopen/ready/synchronize
#   draft PR                 → never (mark ready for review to get a preview)
#   docs-only changes        → never (paths-ignore)
#
# PR previews publish a Workers version alias on the route-free `preview`
# profile: https://pr-<N>-aquilla-web-preview.blue-darkness-7674.workers.dev
# The alias is stable for the life of the PR, so QA can keep one tab open and
# reload it as commits land. Previews always build against the DEVELOPMENT API
# (api.dev.aquilla.app) regardless of base branch — a preview can never write
# to production data.
#
# Draft status is the throttle. Previously a preview only built when a commit
# message carried [preview]/[deploy]; nobody used the tag, so in practice no
# preview was ever uploaded and `aquilla-web-preview` never existed on the
# Cloudflare account.

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Kill in-flight deploys for the same PR / branch when a new push lands.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      wrangler_environment: ${{ steps.resolve.outputs.wrangler_environment }}
      live_environment: ${{ steps.resolve.outputs.live_environment }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      api_host: ${{ steps.resolve.outputs.api_host }}
      sync_worker_host: ${{ steps.resolve.outputs.sync_worker_host }}
      auth_base: ${{ steps.resolve.outputs.auth_base }}
      chat_base: ${{ steps.resolve.outputs.chat_base }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        name: Resolve authorized deployment target
        run: bash scripts/resolve-deployment-target.sh

  deploy:
    needs: target
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.target.outputs.github_environment }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    # Keep the API target in job scope so the build and the artifact guard
    # consume the exact same values. Step-scoped VITE_* variables disappear
    # before the following verification step and previously blocked every
    # otherwise-valid SPA deployment.
    env:
      VITE_SYNC_WORKER_HOST: ${{ needs.target.outputs.sync_worker_host }}
      VITE_AUTH_BASE: ${{ needs.target.outputs.auth_base }}
      VITE_CHAT_BASE: ${{ needs.target.outputs.chat_base }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # DEVEX-1: typecheck + unit tests gate the deploy
      - run: npx tsc -b --noEmit

      - run: pnpm test

      # Branch → worker host mapping:
      #   main                        → prod     (api.aquilla.app)
      #   dev, PR                     → dev      (api.dev.aquilla.app)
      # VITE_AUTH_BASE targets aquilla-identity for auth / sync-token /
      # invite routes. VITE_CHAT_BASE targets aquilla-identity's
      # /chat mount for the LLM completion proxy (folded in from the
      # former aquilla-chat-worker on 2026-05-26 — same JWT secret, one
      # worker). The rest of the frontier API (payments,
      # members, orgs — none of which the SPA calls today) would still
      # use VITE_FRONTIER_BASE if we ever needed it.
      - run: pnpm run build

      - name: Verify built API environment
        run: bash scripts/verify-dist-host.sh "${{ needs.target.outputs.api_host }}"

      # Workers' static-assets parser rejects the SPA `/*  /index.html  200`
      # rule in _redirects (error 100324 — "infinite loop"). SPA fallback is
      # handled by `not_found_handling = "single-page-application"` in
      # wrangler.toml, so strip the file before deploy. (public/_redirects
      # stays in the repo for legacy Pages deploys of other brands.)
      - name: Strip dist/_redirects (Workers static assets rejects it)
        run: rm -f dist/_redirects

      # Pushes to main/dev publish the live Worker for that branch's
      # explicit named environment. The env mapping must match the VITE_* build
      # vars above; never use a bare deploy because it can inherit the wrong
      # top-level worker name, routes, or bindings.
      # PRs upload a preview version aliased as `pr-<N>` on the route-free
      # `preview` profile, reachable at the aliased Workers preview URL without
      # touching any live Worker or route.
      - name: Deploy aquilla-web (main/dev)
        id: deploy_prod
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          command: deploy --env=${{ needs.target.outputs.wrangler_environment }}

      - name: Verify deployed SPA environment
        if: github.event_name != 'pull_request'
        run: node scripts/verify-live-environment.mjs "${{ needs.target.outputs.live_environment }}" --surface=spa

      # `wrangler versions upload` cannot CREATE a Worker — it fails with "You
      # cannot upload a new version of a Worker that does not yet exist" until
      # something has deployed the name once. `aquilla-web-preview` had never
      # been created, because the old commit-tag gate meant this step never ran.
      # Bootstrap it here rather than making the first preview depend on a human
      # running a one-off command: the preview profile declares no routes, so a
      # plain deploy publishes nothing beyond a workers.dev URL, and it also
      # self-heals if the Worker is ever deleted.
      #
      # The URL is read from wrangler's own output, falling back to the
      # deterministic alias form (`<alias>-<worker>.<subdomain>.workers.dev`) so
      # a change in that output degrades to a still-correct link, not a blank
      # comment. Everything interpolated reaches the script through env.
      - name: Upload aquilla-web preview (PR)
        id: deploy_preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
          ALIAS: pr-${{ github.event.number }}
          UPLOAD_MESSAGE: PR ${{ github.event.number }} @ ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          upload() {
            pnpm exec wrangler versions upload --env=preview \
              --preview-alias "$ALIAS" --message "$UPLOAD_MESSAGE" 2>&1 | tee upload.log
          }

          if ! upload; then
            grep -q "does not yet exist" upload.log || exit 1
            echo "::notice::aquilla-web-preview does not exist yet; bootstrapping the route-free preview Worker."
            pnpm exec wrangler deploy --env=preview
            upload
          fi

          url=$(grep -oE "https://${ALIAS}-aquilla-web-preview\.[a-z0-9-]+\.workers\.dev" upload.log | head -1)
          [ -n "$url" ] || url="https://${ALIAS}-aquilla-web-preview.blue-darkness-7674.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Fail the job if the alias does not actually serve the SPA. A green
      # check that links QA to a 404 is worse than a red one.
      - name: Smoke-check the preview URL
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$PREVIEW_URL/app" || echo 000)
            [ "$code" = "200" ] && echo "preview OK ($PREVIEW_URL)" && exit 0
            echo "attempt $attempt: HTTP $code — retrying"
            sleep 6
          done
          echo "::error::Preview alias did not serve the SPA at $PREVIEW_URL/app (last HTTP $code)"
          exit 1

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pages-preview
          message: |
            **Preview:** ${{ steps.deploy_preview.outputs.url }}

            | | |
            | --- | --- |
            | Commit | `${{ github.event.pull_request.head.sha }}` |
            | API | `api.dev.aquilla.app` (development) |

            The link is stable for the life of this PR — reload it as new
            commits land. Previews always talk to the **development** API and
            database, never production, whatever branch this PR targets.

            Draft PRs do not build a preview; mark the PR ready for review to
            get one.
