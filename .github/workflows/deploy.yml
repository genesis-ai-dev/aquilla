name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Frontend points at prod workers when building from main; staging
      # workers everywhere else (dev branch, PR previews — see PR #44 for
      # the trigger expansion). Production cors-proxy URL is still
      # ryderwishart's account — to be migrated in a follow-up alongside
      # the signaling consolidation.
      - run: npm run build
        env:
          VITE_SYNC_WORKER_HOST: ${{ github.ref == 'refs/heads/main' && 'codex-sync-worker.blue-darkness-7674.workers.dev' || 'codex-sync-worker-staging.blue-darkness-7674.workers.dev' }}
          VITE_GIT_CORS_PROXY: ${{ github.ref == 'refs/heads/main' && 'https://codex-git-proxy.ryderwishart.workers.dev' || 'https://codex-git-proxy-staging.blue-darkness-7674.workers.dev' }}

      - name: Compute deploy branch alias
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          command: pages deploy dist --project-name=codex-web --branch=${{ steps.branch.outputs.name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pages-preview
          message: |
            **Cloudflare Pages preview**

            - Branch alias: https://${{ steps.branch.outputs.name }}.codex-web-4ih.pages.dev
            - This deployment: ${{ steps.deploy.outputs.deployment-url }}
            - Commit: `${{ github.event.pull_request.head.sha }}`

            Re-deployed on every push to this PR.
