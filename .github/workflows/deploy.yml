name: Deploy aquilla-web Worker

# Deploys the aquilla brand of the SPA to the `aquilla-web` Cloudflare Worker
# (Workers with static assets). Replaces the former `codex-web` Pages deploy.
# PR previews use Workers version aliases:
#   pr-<N>-aquilla-web.<subdomain>.workers.dev
#
# When previews are built:
#   push to main / dev       → always (these are "real" deploys)
#   PR opened / reopened     → always (give reviewers something to click)
#   PR ready_for_review      → always (author signaled "look at this")
#   PR synchronize (push)    → only if [preview] or [deploy] in commit message
#   draft PR                 → never (author is iterating; not blocking quota on it)
#   docs-only changes        → never (paths-ignore)
#
# Branch alias stays pointing at the last *deployed* commit. Iterate freely
# without burning a build; push one [preview] commit when you want reviewers
# to see the latest.

on:
  push:
    branches: [main, staging, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [dev, staging, main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Kill in-flight deploys for the same PR / branch when a new push lands.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "synchronize" ]; then
            msg=$(git log -1 --format='%s%n%b')
            if echo "$msg" | grep -qiE '\[preview\]|\[deploy\]'; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "reason=preview-tag" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "reason=synchronize-without-tag" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=${{ github.event_name }}/${{ github.event.action }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.decide.outputs.deploy != 'true'
        run: |
          echo "::notice::Skipping preview deploy (${{ steps.decide.outputs.reason }}). Add [preview] to a commit message to force one."

      - uses: pnpm/action-setup@v6
        if: steps.decide.outputs.deploy == 'true'

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.decide.outputs.deploy == 'true'

      # DEVEX-1: typecheck + unit tests gate the deploy
      - run: npx tsc -b --noEmit
        if: steps.decide.outputs.deploy == 'true'

      - run: pnpm test
        if: steps.decide.outputs.deploy == 'true'

      # Branch → worker host mapping:
      #   main                        → prod     (api.aquilla.app)
      #   staging                     → staging  (api.staging.aquilla.app)
      #   dev, PR                     → dev      (api.dev.aquilla.app)
      # VITE_AUTH_BASE targets aquilla-identity for auth / sync-token /
      # invite routes. VITE_CHAT_BASE targets aquilla-identity's
      # /chat mount for the LLM completion proxy (folded in from the
      # former aquilla-chat-worker on 2026-05-26 — same JWT secret, one
      # worker). The rest of the frontier API (payments,
      # members, orgs — none of which the SPA calls today) would still
      # use VITE_FRONTIER_BASE if we ever needed it.
      - run: pnpm run build
        if: steps.decide.outputs.deploy == 'true'
        env:
          # API lives on its own subdomain (api.aquilla.app) — separate from
          # the SPA (aquilla.app — the canonical app domain, no web. prefix).
          # Auth is bearer-token-only so cross-subdomain CORS is permitted
          # (see CORS_HEADERS in auth-worker/src/index.ts). Safari drops
          # *.workers.dev WebSockets, which is why sync stays on a real zone
          # via Workers Routes; the worker strips its /sync prefix internally.
          VITE_SYNC_WORKER_HOST: ${{ github.ref == 'refs/heads/main' && 'api.aquilla.app/sync' || github.ref == 'refs/heads/staging' && 'api.staging.aquilla.app/sync' || 'api.dev.aquilla.app/sync' }}
          VITE_AUTH_BASE: ${{ github.ref == 'refs/heads/main' && 'https://api.aquilla.app/identity' || github.ref == 'refs/heads/staging' && 'https://api.staging.aquilla.app/identity' || 'https://api.dev.aquilla.app/identity' }}
          VITE_CHAT_BASE: ${{ github.ref == 'refs/heads/main' && 'https://api.aquilla.app/chat' || github.ref == 'refs/heads/staging' && 'https://api.staging.aquilla.app/chat' || 'https://api.dev.aquilla.app/chat' }}

      # Workers' static-assets parser rejects the SPA `/*  /index.html  200`
      # rule in _redirects (error 100324 — "infinite loop"). SPA fallback is
      # handled by `not_found_handling = "single-page-application"` in
      # wrangler.toml, so strip the file before deploy. (public/_redirects
      # stays in the repo for legacy Pages deploys of other brands.)
      - name: Strip dist/_redirects (Workers static assets rejects it)
        if: steps.decide.outputs.deploy == 'true'
        run: rm -f dist/_redirects

      # Pushes to main/staging/dev publish the live Worker for THAT branch's
      # env. The env mapping must match the VITE_* build vars above — a bare
      # `deploy` here targets the top-level wrangler.toml worker (aquilla-web,
      # PRODUCTION), which shipped dev-API-pointing bundles to aquilla.app on
      # every dev push (2026-07-01/02 outages: api.dev.aquilla.app is
      # NXDOMAIN, so prod looked API-dead until a manual prod redeploy).
      # NOTE: --env=staging/--env=development declare `routes`, and CI's token
      # lacks Zone.Workers Routes edit — the code uploads, then the route-sync
      # step fails (code 10000, same as deploy-workers.yml). Red but harmless;
      # fix is upgrading the token (see wrangler.toml route convention doc).
      # PRs upload a preview version aliased as `pr-<N>`, reachable at
      # https://pr-<N>-aquilla-web.<workers-subdomain>.workers.dev without
      # touching the production version.
      - name: Deploy aquilla-web (main/staging/dev)
        id: deploy_prod
        if: steps.decide.outputs.deploy == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          command: deploy ${{ github.ref == 'refs/heads/main' && ' ' || github.ref == 'refs/heads/staging' && '--env=staging' || '--env=development' }}

      - name: Upload aquilla-web preview (PR)
        id: deploy_preview
        if: steps.decide.outputs.deploy == 'true' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a80496d1e59948a9cbaa3c643ba81d7
          command: versions upload --preview-alias "pr-${{ github.event.number }}" --message "PR ${{ github.event.number }} @ ${{ github.event.pull_request.head.sha }}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.decide.outputs.deploy == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pages-preview
          message: |
            **aquilla-web Worker preview**

            - Preview alias: `pr-${{ github.event.number }}-aquilla-web.<workers-subdomain>.workers.dev`
              (see the "Upload aquilla-web preview" step output for the full URL — first PR after this CI change will reveal the subdomain; pin it here afterwards)
            - Commit: `${{ github.event.pull_request.head.sha }}`

            Re-uploads on commits tagged `[preview]` (skip the tag to iterate without rebuilding).
