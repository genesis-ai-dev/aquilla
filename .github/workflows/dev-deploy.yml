name: Dev deploy

# Deploys dev.aquilla.app from every merge to dev, migrations first
# (docs/RELEASE-RISK-GATES.md "Dev deploys on merge"). A merge that breaks
# dev fails here, loudly, hours before the hourly production line would
# pick the same PR.
#
# Off until the repository variable AUTO_DEV_DEPLOY is `on` — the
# 2026-10-30 decision was to switch it on once the test baseline is green,
# not before. Until then `pnpm run deploy:aquilla:dev` by hand is unchanged.
#
# Migrations are applied to the dev Neon branch only; production migrations
# stay a person's job (neon:apply:prod with --snapshot), and a production
# deploy still fails closed on a pending migration.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AUTO_DEV_DEPLOY == 'on'
    runs-on: ubuntu-latest
    environment:
      name: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: sweet-paper-88472094
      NEON_PRODUCTION_BRANCH: production
      NEON_DEV_BRANCH: dev
      NEON_DEV_PG_HOST: ${{ secrets.NEON_DEV_PG_HOST }}
      NEON_DEV_PG_DB: ${{ secrets.NEON_DEV_PG_DB }}
      NEON_DEV_PG_ROLE: ${{ secrets.NEON_DEV_PG_ROLE }}
      NEON_DEV_PG_PASSWORD: ${{ secrets.NEON_DEV_PG_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      - name: Apply pending migrations to the dev Neon branch
        run: pnpm neon:apply:dev
      - name: Deploy dev
        run: pnpm run deploy:aquilla:dev
