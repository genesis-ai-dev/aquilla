# Dedicated-box e2e. GitHub is the webhook + job queue; a self-hosted runner
# on Hetzner is the compute. Dispatch-only until a runner shows Idle — a
# pull_request trigger with no runner queues every PR forever.
#
# Enable on PRs only after: bootstrap.sh → ensure-e2e-runtime.sh →
# install-runners.sh, and a successful workflow_dispatch of this file.
# See docs/runbooks/hetzner-ci.md.

name: E2E (Hetzner)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite (smart is a live-model, advisory run)
        type: choice
        default: smoke
        options: [smoke, smart, smart-qualify, smart-audit]

concurrency:
  group: e2e-hetzner
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, hetzner, e2e]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure Docker Postgres (aquilla-dev-pg)
        run: bash scripts/hetzner-ci/ensure-e2e-runtime.sh

      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir auth-worker install --frozen-lockfile
          pnpm --dir sync-worker install --frozen-lockfile

      - name: Install Playwright Chromium (cached on the box after first run)
        run: pnpm exec playwright install chromium

      - name: Smoke e2e
        if: inputs.suite == 'smoke'
        run: pnpm test:e2e:smoke

      - name: Install pinned Jev
        if: startsWith(inputs.suite, 'smart')
        run: |
          python3 -m venv "$RUNNER_TEMP/smart-tools"
          "$RUNNER_TEMP/smart-tools/bin/pip" install uv==0.9.9
          "$RUNNER_TEMP/smart-tools/bin/uv" sync --project smart-tests --frozen

      - name: Smart test qualification
        if: inputs.suite == 'smart-qualify'
        run: pnpm test:smart:qualify

      - name: Jev DOM audit
        if: inputs.suite == 'smart-audit'
        run: pnpm test:smart:audit

      - name: Live Jev journeys
        if: inputs.suite == 'smart'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TEXT_MODEL_API_KEY: ${{ secrets.TEXT_MODEL_API_KEY }}
          TYPESAFE_URL: ${{ vars.TYPESAFE_URL || 'https://openrouter.ai/api/alpha/decisions' }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'typesafe/jev-1.13' }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL || 'inception/mercury-2.5' }}
        run: pnpm test:smart

      - name: Upload smart test evidence (including passes)
        if: always() && startsWith(inputs.suite, 'smart')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smart-testing-${{ github.run_id }}
          path: smart-tests/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload e2e logs on failure
        if: failure() && inputs.suite == 'smoke'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            .e2e-logs*/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
