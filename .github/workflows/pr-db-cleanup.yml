name: PR DB cleanup

# Tears down the per-PR D1 + sync-worker + R2 keys when a PR closes.
# Runs whether the PR is merged or just closed — orphan resources cost
# CF quota indefinitely otherwise.

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run cleanup script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/pr-db-cleanup.sh
