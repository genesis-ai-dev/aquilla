name: PR DB fork

# Provisions a per-PR D1 + sync-worker variant when a PR touches a
# migration file under sync-worker/migrations/. Idempotent — re-running
# on subsequent pushes only applies new migrations, doesn't recreate
# the DB.
#
# The PR-specific worker shares R2 with the staging bucket but uses
# R2_KEY_PREFIX=pr-<N> so its objects are isolated. Cleanup runs on
# PR close — see pr-db-cleanup.yml.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
    paths:
      - 'sync-worker/migrations/**'

# Cancel an in-flight fork run when a new push lands; the latest commit
# wins.
concurrency:
  group: pr-db-fork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run fork script
        id: fork
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/pr-db-fork.sh

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-db-fork
          message: |
            **Per-PR sync-worker provisioned**

            This PR touches migration files under `sync-worker/migrations/`. To
            isolate the migration from the shared staging DB, a per-PR sync
            stack has been spun up:

            - D1: `${{ steps.fork.outputs.db_name }}` (forked from staging schema; new migrations applied)
            - Worker: ${{ steps.fork.outputs.worker_url }}
            - R2: shared `codex-snapshots-staging` bucket, namespaced under `pr-${{ github.event.pull_request.number }}/`

            The PR's preview Pages bundle is built with `VITE_SYNC_WORKER_HOST`
            pointing at the worker above. Auth is disabled on the PR variant
            (`ALLOW_UNAUTHENTICATED=true`) — fine for the staging sandbox, not
            a model for prod.

            Closing the PR triggers cleanup (deletes D1, worker, and R2 keys
            under `pr-${{ github.event.pull_request.number }}/`).
