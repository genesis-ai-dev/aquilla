name: Release deploy

# The hourly production deploy (docs/RELEASE-RISK-GATES.md). Every hour it
# finds the one release branch in flight and deploys its HEAD when, for that
# exact sha, the `release-verify` check succeeded and smart Jev has reported
# anything but FAIL — the same two conditions a person checks today, read by
# scripts/release-deploy-check.mjs with no judgment of its own. The deploy
# itself is the same `pnpm run deploy:aquilla` chain a person runs, tag push
# included; the tag closes the release and the next slice is cut.
#
# Off until the repository variable HOURLY_RELEASE is `on`. Flipping it is
# the one-time decision to let production deploy without a person pressing
# a button (DEPLOYMENT-ENVIRONMENTS.md "Deployment ownership"); a person
# can still deploy by hand at any time, and a branch deployed by hand is
# simply tagged already when this runs.
#
# Secrets: CLOUDFLARE_API_TOKEN and the NEON_* set deploy-workers.yml uses.
# RELEASE_BOT_TOKEN (contents + deployments write, allowed through the
# "release tags" ruleset) pushes the tag; without it GITHUB_TOKEN is tried,
# and a ruleset that refuses it fails the run after the deploy has already
# gone live — the tag is then a person's job (scripts/tag-release.sh).

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Report whether the open release could deploy, without deploying'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  deployments: write
  actions: write

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  check:
    if: vars.HOURLY_RELEASE == 'on' || inputs.check_only
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      branch: ${{ steps.check.outputs.branch }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: |
          git fetch origin --tags
          git fetch origin 'refs/heads/release/*:refs/remotes/origin/release/*'
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Who may decide the deploy by commit comment; see release-deploy-check.mjs.
          JEV_TRUSTED_LOGINS: ${{ vars.JEV_TRUSTED_LOGINS }}
        run: |
          node scripts/release-deploy-check.mjs > "$RUNNER_TEMP/check.json"
          cat "$RUNNER_TEMP/check.json"
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
            const out = [`deploy=${c.deploy}`, `branch=${c.branch ?? ""}`, `sha=${c.sha ?? ""}`]
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n")
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${c.deploy ? "Deploys" : "No deploy"}: ${c.reason}${c.branch ? ` (${c.branch} @ ${c.sha})` : ""}\n`)
          ' "$RUNNER_TEMP/check.json"

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true' && vars.HOURLY_RELEASE == 'on' && !inputs.check_only
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
      NEON_PG_HOST: ${{ secrets.NEON_PG_HOST }}
      NEON_PG_DB: ${{ secrets.NEON_PG_DB }}
      NEON_PG_ROLE: ${{ secrets.NEON_PG_ROLE }}
      NEON_PG_PASSWORD: ${{ secrets.NEON_PG_PASSWORD }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: sweet-paper-88472094
      NEON_PRODUCTION_BRANCH: production
      NEON_DEV_BRANCH: dev
      # tag-release.sh records the GitHub Deployment and pushes the calver tag.
      GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.branch }}
          fetch-depth: 0
      - name: HEAD is still the checked sha
        env:
          EXPECTED: ${{ needs.check.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED" || { echo "::error::branch moved since the check"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      # SPA, sync, auth, then the tag: the same chain a person runs. Each
      # step re-runs the Neon schema guard and refuses a non-release branch.
      - name: Deploy production and tag
        run: pnpm run deploy:aquilla
      # A tag pushed with a token from this workflow does not start the
      # tag-push trigger of release-cut.yml (GitHub never chains runs from
      # GITHUB_TOKEN events), so the next slice is asked for by hand here.
      - name: Cut the next slice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-cut.yml --ref dev
      # The same rule silences notify-help-bot.yml's tag trigger, so the
      # aquilla-help bot is woken by hand too. The check job deploys only an
      # untagged branch, so the tag on HEAD is the one tag-release.sh just
      # pushed. Run on dev so a fix to the ping lands without a release.
      - name: Wake the help bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git tag --points-at HEAD --list '20*' | sort -V | tail -1)"
          test -n "$tag" || { echo "::error::no calver tag on HEAD after the deploy"; exit 1; }
          gh workflow run notify-help-bot.yml --ref dev -f tag="$tag" -f sha="$(git rev-parse HEAD)"
