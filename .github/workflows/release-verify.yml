name: Release verify

# The full suite on a release branch, every push. A release branch is a set
# of cherry-picks (scripts/release-cut.mjs), and a pick that applies cleanly
# can still depend on a held PR it was built on; this is what catches that
# before the hourly deploy (release-deploy.yml) reads this check's result
# for the branch's HEAD. PRs into dev run only the suites their diff touches
# (ci.yml); the release line runs everything, once, here.

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm run i18n:check
      - run: pnpm run scan:secrets

  unit:
    name: unit (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --shard=${{ matrix.shard }}/3
      - if: matrix.shard == 1
        run: pnpm test:worker

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - run: pnpm run type-check && pnpm test
        working-directory: auth-worker
      - run: pnpm run type-check && pnpm test
        working-directory: sync-worker
      - run: npm ci && npm run type-check && npm test
        working-directory: agent-worker

  build:
    runs-on: ubuntu-latest
    env:
      VITE_AUTH_BASE: https://api.aquilla.app/identity
      VITE_SYNC_WORKER_HOST: api.aquilla.app/sync
      VITE_CHAT_BASE: https://api.aquilla.app/chat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: bash scripts/verify-dist-host.sh api.aquilla.app

  # The one check name release-deploy.yml reads for the branch HEAD. A
  # skipped or cancelled job fails it.
  release-verify:
    needs: [typecheck, lint, unit, workers, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -q '"result": "failure"' && exit 1
          echo "$RESULTS" | grep -q '"result": "cancelled"' && exit 1
          echo "$RESULTS" | grep -q '"result": "skipped"' && exit 1
          exit 0
