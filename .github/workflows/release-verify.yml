name: Release verify

# Build and type-check on a release branch, every push. A release branch is
# a set of cherry-picks (scripts/release-cut.mjs), and a pick that applies
# cleanly can still depend on a held PR it was built on. That shows as a
# compile error, and this catches it before the deploy (release-deploy.yml)
# reads this check's result for the branch's HEAD.
#
# Until 2026-11-27 this ran the full suite again: lint, every unit shard,
# and every worker suite. Each of those PRs had already run its suites in
# ci.yml. In 82 runs from 2026-10-31 the full suite failed twice, once on a
# runner setup fault, and it took a median 47 minutes (13 after the suites
# were sharded) from every release. What a cherry-pick slice can break that
# its PRs did not is the build, so the build is what stays: `pnpm run build`
# is `tsc -b` plus the Vite build, and each worker has its own type-check.

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each worker's own `tsc`. auth-worker imports sync-worker source and the
  # reverse, so both installs are needed for either check.
  worker-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            auth-worker/pnpm-lock.yaml
            sync-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - run: pnpm run type-check
        working-directory: auth-worker
      - run: pnpm run type-check
        working-directory: sync-worker

  build:
    runs-on: ubuntu-latest
    env:
      VITE_AUTH_BASE: https://api.aquilla.app/identity
      VITE_SYNC_WORKER_HOST: api.aquilla.app/sync
      VITE_CHAT_BASE: https://api.aquilla.app/chat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: bash scripts/verify-dist-host.sh api.aquilla.app

  # The one check name release-deploy.yml reads for the branch HEAD. A
  # skipped or cancelled job fails it.
  release-verify:
    needs: [build, worker-typecheck]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -q '"result": "failure"' && exit 1
          echo "$RESULTS" | grep -q '"result": "cancelled"' && exit 1
          echo "$RESULTS" | grep -q '"result": "skipped"' && exit 1
          exit 0
