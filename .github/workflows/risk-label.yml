name: Risk labels

# Labels every pull request into dev with the production risk areas its
# files touch (`risk:events`, `risk:auth`, `risk:offline-sync`,
# `risk:migration`, `risk:infra`, and the noted-only `risk:export`,
# `risk:sync`), from the one file map in scripts/release-risk.mjs. A PR
# carrying a holding area is kept off the hourly release line by
# scripts/release-plan.mjs until a person adds `release:approved`; see
# docs/RELEASE-RISK-GATES.md. The planner classifies the merged diff itself,
# so these labels inform people and route review; they are not the gate.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: risk-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.label.outputs.areas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The classifier runs from the base branch, so a PR cannot
          # relabel itself by editing the file map in the same change.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - id: label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The classifier is read from base, so until this workflow's own PR
        # merges there is nothing to run: skip, with no labels and no areas.
        run: |
          if [ ! -f scripts/release-risk-label.mjs ]; then
            echo "scripts/release-risk-label.mjs is not on the base branch yet; nothing to classify"
            echo "holds=false" >> "$GITHUB_OUTPUT"
            echo "areas=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-risk-label.mjs "$PR_NUMBER"
      - if: steps.label.outputs.holds == 'true'
        env:
          AREAS: ${{ steps.label.outputs.areas }}
        run: |
          echo "### Off the hourly line until a person approves" >> "$GITHUB_STEP_SUMMARY"
          echo "Areas: $AREAS. After manual QA, add the \`release:approved\` label." >> "$GITHUB_STEP_SUMMARY"

  # The events gate (docs/RELEASE-RISK-GATES.md "Replay gate"). Runs only for a
  # PR that touches the events area, on the PR's own head: the corpus of real
  # projects (fetched from R2) plus the synthetic ones replay through this
  # build's rebuild to the committed golden projection. Green here lifts the
  # `events` hold in scripts/release-plan.mjs (AREA_GATES), so the job's name
  # is the check name the planner reads. The job also fails when golden.json
  # changed in the PR: a projection change on purpose still goes to a person.
  replay-gate:
    needs: label
    if: contains(needs.label.outputs.areas, 'events')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sync-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker
      - name: Fetch the real-project corpora from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
        run: node scripts/replay-corpus.mjs fetch
      - name: Replay every corpus against this build
        env:
          REPLAY_CORPUS_REQUIRED: "1"
        run: pnpm exec vitest run src/__tests__/replay-corpus.test.ts
        working-directory: sync-worker
      - name: A changed golden means the projection changed on purpose; a person reviews it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA" HEAD -- sync-worker/replay-corpus/golden.json; then
            echo "::error file=sync-worker/replay-corpus/golden.json::golden.json changed in this PR: the replay gate stays red so the hold stays on. Review the golden diff and add release:approved." 
            exit 1
          fi
