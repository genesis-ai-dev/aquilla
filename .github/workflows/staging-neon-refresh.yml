name: Refresh Staging Neon Branch

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These two Sunday schedules cover 4:07 a.m. Eastern
    # during daylight and standard time; the first step gates execution to the
    # matching America/New_York offset so the non-matching run exits cleanly.
    - cron: "7 8 * * 0"
    - cron: "7 9 * * 0"

concurrency:
  group: staging-neon-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Gate scheduled run to Sunday 4 a.m. Eastern
        id: eastern_gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          eastern_offset="$(TZ=America/New_York date +%z)"
          schedule="${{ github.event.schedule }}"
          if { [ "$schedule" = "7 8 * * 0" ] && [ "$eastern_offset" = "-0400" ]; } || \
             { [ "$schedule" = "7 9 * * 0" ] && [ "$eastern_offset" = "-0500" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: schedule '$schedule' does not match today's Eastern offset ($eastern_offset)."
          fi

      - uses: actions/checkout@v7
        if: steps.eastern_gate.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.eastern_gate.outputs.should_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.eastern_gate.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.eastern_gate.outputs.should_run == 'true'

      - name: Verify Neon refresh credentials are configured
        if: steps.eastern_gate.outputs.should_run == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          STAGING_API_PROJECT_READ_URL: ${{ secrets.STAGING_API_PROJECT_READ_URL }}
          STAGING_API_PROJECT_READ_TOKEN: ${{ secrets.STAGING_API_PROJECT_READ_TOKEN }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error::NEON_API_KEY is required to restore the staging Neon branch from production."
            exit 1
          fi
          if [ -n "$STAGING_API_PROJECT_READ_URL" ] && [ -z "$STAGING_API_PROJECT_READ_TOKEN" ]; then
            echo "::error::STAGING_API_PROJECT_READ_TOKEN is required when STAGING_API_PROJECT_READ_URL is set."
            exit 1
          fi

      - name: Restore staging branch from production and apply staging migrations
        if: steps.eastern_gate.outputs.should_run == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: sweet-paper-88472094
          NEON_STAGING_BRANCH: staging
          NEON_PRODUCTION_BRANCH: production
          NEON_STAGING_DATABASE: neondb
          NEON_STAGING_ROLE: neondb_owner
          STAGING_API_HEALTH_URL: https://api.staging.aquilla.app/identity/api/v2/health
          STAGING_API_PROJECT_READ_URL: ${{ secrets.STAGING_API_PROJECT_READ_URL }}
          STAGING_API_PROJECT_READ_TOKEN: ${{ secrets.STAGING_API_PROJECT_READ_TOKEN }}
        run: pnpm neon:refresh:staging
