name: tauri-build
# Unsigned dry run of the desktop build. Same platforms as tauri-release.yml,
# but no Apple/Windows/updater signing secrets and no GitHub release: each OS
# uploads its installers as a workflow artifact. Use it to shake out the build
# before tagging a `v*` release, or to hand someone a test build.
#
# macOS bundles are ad-hoc signed, not notarized: after downloading, run
# `xattr -dr com.apple.quarantine Aquilla.app` (or right-click → Open) to launch.
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Also run the Tauri e2e smoke suite (the release gate)
        type: boolean
        default: true
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri-build.yml"

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Only PRs from branches in this repo (contributors with write access) —
    # fork PRs would otherwise publish installers built from unreviewed code
    # as artifacts of this public repo.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          # Cross-compiled on the arm64 runner (GitHub retires macOS images ~yearly; Intel ones first).
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - run: pnpm install --frozen-lockfile

      - run: cargo test
        working-directory: src-tauri

      # The embedded fallback bundle, built once with production hosts exactly
      # like deploy:aquilla:spa. tauri.unsigned.conf.json blanks
      # beforeBuildCommand so the tauri builds below reuse this dist/ instead
      # of rebuilding it without the hosted env.
      - run: pnpm run build:hosted
        env:
          # tsc -b runs out of Node's default heap on the 7 GB macOS runners.
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_AUTH_BASE: https://api.aquilla.app/identity
          VITE_SYNC_WORKER_HOST: api.aquilla.app/sync
          VITE_CHAT_BASE: https://api.aquilla.app/chat

      - name: Build unsigned installers
        run: pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.unsigned.conf.json
        env:
          # A public key, so reading it outside the signing environment is fine.
          # Empty on fork PRs: that build just never applies hot bundles.
          AQUILLA_BUNDLE_PUBKEY: ${{ secrets.AQUILLA_BUNDLE_PUBKEY }}
          AQUILLA_BUNDLE_VERSION: ${{ github.sha }}
          AQUILLA_BUNDLE_SHA: ${{ github.sha }}

      # .dmg/.exe/.msi/.deb/.rpm only: upload-artifact drops the executable bit,
      # so a bare .app or AppImage would arrive broken.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aquilla-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

      # Same suite tauri-release.yml gates on (e2e/tauri/smoke.spec.ts): always on
      # PRs, optional on manual runs. Skipped for the cross-compiled Intel build,
      # which this arm64 runner can't run.
      - name: Build e2e binary
        if: (github.event_name == 'pull_request' || inputs.smoke) && matrix.target != 'x86_64-apple-darwin'
        run: pnpm tauri build --debug --no-bundle --features e2e-webdriver --config src-tauri/tauri.e2e.conf.json --config src-tauri/tauri.unsigned.conf.json

      - name: Run Tauri e2e smoke suite
        if: (github.event_name == 'pull_request' || inputs.smoke) && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm run test:e2e:tauri
          else
            pnpm run test:e2e:tauri
          fi

  # One PR comment (edited in place on every run) and the run summary, linking
  # each platform's installer artifact. Links need a GitHub login and expire
  # with the artifacts (retention-days above).
  links:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Post installer links
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          artifacts=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[] | [.name, .id, .expires_at[:10]] | @tsv')
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | [.name, (.conclusion // .status)] | @tsv')

          marker='<!-- tauri-build-links -->'
          body="$marker"$'\n'"### Desktop test builds for \`${SHA:0:9}\`"$'\n\n'
          body+="| Platform | Installer | Build |"$'\n'"|---|---|---|"$'\n'
          expires=""
          for row in "aarch64-apple-darwin|macOS (Apple Silicon)" "x86_64-apple-darwin|macOS (Intel)" "x86_64-pc-windows-msvc|Windows" "x86_64-unknown-linux-gnu|Linux"; do
            target=${row%%|*}; label=${row#*|}
            art=$(printf '%s\n' "$artifacts" | awk -F'\t' -v n="aquilla-$target" '$1 == n { print $2 "\t" $3 }')
            result=$(printf '%s\n' "$jobs" | awk -F'\t' -v t="$target" 'index($1, t) { print $2 }')
            if [ -n "$art" ]; then
              link="[download](https://github.com/$REPO/actions/runs/$RUN_ID/artifacts/${art%%$'\t'*})"
              expires=${art#*$'\t'}
            else
              link="none"
            fi
            body+="| $label | $link | ${result:-unknown} |"$'\n'
          done
          body+=$'\n'"Unsigned, for testing only. macOS: run \`xattr -dr com.apple.quarantine /Applications/Aquilla.app\` after installing (not notarized)."
          body+=" Links need a GitHub login${expires:+ and expire $expires}. [Workflow run]($run_url)"$'\n'

          printf '%s' "$body" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$PR" ] || exit 0

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
