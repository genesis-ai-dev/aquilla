name: tauri-release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          # Cross-compiled on the arm64 runner (GitHub retires macOS images ~yearly; Intel ones first).
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    # Any push of a `v*` tag reaches this job and, further down, the six
    # Apple/Windows/Tauri code-signing secrets — before that, it builds and runs
    # the tagged commit's own code (npm lifecycle scripts, `cargo build`/`build.rs`,
    # the Tauri CLI). A `v*` tag is not gated to any reviewed branch anywhere in
    # this repo (unlike production web/worker deploys, which enter the `production`
    # Environment restricted to `release/*/*/*` — see docs/DEPLOYMENT-ENVIRONMENTS.md
    # and OPSEC.md D4). This Environment is the equivalent gate for the one
    # pipeline that ships signed code to end users: it holds the job at the
    # "Waiting" state, before checkout, until a required reviewer approves it in
    # GitHub. Configure "desktop-release-signing" in Settings → Environments with
    # required reviewers (and, if desired, a deployment tag policy of `v*` scoped
    # to protected branches) — that repo setting is what gives this line teeth.
    environment: desktop-release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - run: pnpm install --frozen-lockfile

      # DEVEX-1: typecheck + unit tests gate the release build
      - run: npx tsc -b --noEmit

      - run: pnpm test

      # The shell only trusts hot bundles signed by this ed25519 public key
      # (raw 32 bytes, hex; from `pnpm desktop:bundle:keygen`). It is a
      # compile-time option_env! in src-tauri, so every cargo build below
      # gets it. Without it a release shell would never accept hot bundles.
      # Without it, bundling with createUpdaterArtifacts (tauri.release.conf.json)
      # cannot sign the updater archives, so no release ever reaches installed
      # apps. Its public half is plugins.updater.pubkey in tauri.conf.json.
      - name: Guard against a missing updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty — the release would ship without updater signatures or latest.json. Add the private key matching plugins.updater.pubkey (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD)."
            exit 1
          fi

      - name: Guard against a missing hot-bundle public key
        env:
          AQUILLA_BUNDLE_PUBKEY: ${{ secrets.AQUILLA_BUNDLE_PUBKEY }}
        shell: bash
        run: |
          if [ -z "$AQUILLA_BUNDLE_PUBKEY" ]; then
            echo "::error::AQUILLA_BUNDLE_PUBKEY secret is empty — a release shell built without it would never accept hot bundles (docs/superpowers/specs/2026-11-05-desktop-hot-bundle.md). Run pnpm desktop:bundle:keygen and add both secrets."
            exit 1
          fi

      - run: cargo test
        working-directory: src-tauri
        env:
          AQUILLA_BUNDLE_PUBKEY: ${{ secrets.AQUILLA_BUNDLE_PUBKEY }}

      # Builds the embedded fallback bundle the shell serves until its first hot
      # bundle lands, so it must point at production hosts exactly like
      # deploy:aquilla:spa (package.json) does. Both tauri builds below blank
      # beforeBuildCommand (tauri.unsigned/release.conf.json) so they package
      # this dist/ instead of rebuilding it without the hosted env.
      - run: pnpm run build:hosted
        env:
          VITE_AUTH_BASE: https://api.aquilla.app/identity
          VITE_SYNC_WORKER_HOST: api.aquilla.app/sync
          VITE_CHAT_BASE: https://api.aquilla.app/chat

      # e2e/tauri/smoke.spec.ts ("Plan 3") — native-shell smoke suite, release-gate only (not
      # a push gate, see AGENTS.md/docs/superpowers). Builds a debug binary with the
      # e2e-webdriver feature (embedded WebDriver server, see src-tauri/src/lib.rs) and the
      # src-tauri/tauri.e2e.conf.json capability grant merged in — neither is ever part of
      # the real signed build below. A failure here blocks that OS's signed build/publish.
      # = tauri:build:e2e, plus the unsigned config so it keeps the hosted dist/.
      # The cross-compiled Intel build can't run on this arm64 runner, and its
      # code is identical to the arm64 build that does run the suite.
      - name: Build e2e binary
        if: matrix.target != 'x86_64-apple-darwin'
        run: pnpm tauri build --debug --no-bundle --features e2e-webdriver --config src-tauri/tauri.e2e.conf.json --config src-tauri/tauri.unsigned.conf.json
        env:
          AQUILLA_BUNDLE_PUBKEY: ${{ secrets.AQUILLA_BUNDLE_PUBKEY }}

      - name: Run Tauri e2e smoke suite
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm run test:e2e:tauri
          else
            pnpm run test:e2e:tauri
          fi

      # Fail loudly (not silently ship a broken/unverifiable auto-updater) if
      # tauri.conf.json still carries the scaffolded placeholder updater
      # endpoint/pubkey — see src-tauri/tauri.conf.json plugins.updater.
      - name: Guard against placeholder updater config
        run: |
          if grep -q 'REPLACE_ORG\|REPLACE_WITH_OUTPUT_OF' src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey still carries the scaffolded placeholder — a tagged release would ship with an unverifiable auto-updater. The endpoint is already set (genesis-ai-dev/aquilla releases); run 'npx tauri signer generate' and paste the public key into plugins.updater.pubkey (the private key goes in TAURI_SIGNING_PRIVATE_KEY), or set plugins.updater.active to false."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarization + signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Windows code signing (injected via env, not stored in conf)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Hot-bundle verification key, compiled into the shell (option_env!)
          AQUILLA_BUNDLE_PUBKEY: ${{ secrets.AQUILLA_BUNDLE_PUBKEY }}
          # Identity of the dist embedded in this shell, so a fresh install does
          # not re-download an identical bundle (hot_bundle/mod.rs).
          AQUILLA_BUNDLE_VERSION: ${{ github.ref_name }}
          AQUILLA_BUNDLE_SHA: ${{ github.sha }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aquilla ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
