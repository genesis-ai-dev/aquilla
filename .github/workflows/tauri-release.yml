name: tauri-release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - run: pnpm install --frozen-lockfile

      # DEVEX-1: typecheck + unit tests gate the release build
      - run: npx tsc -b --noEmit

      - run: pnpm test

      - run: cargo test
        working-directory: src-tauri

      - run: pnpm run build

      # e2e/tauri/smoke.spec.ts ("Plan 3") — native-shell smoke suite, release-gate only (not
      # a push gate, see AGENTS.md/docs/superpowers). Builds a debug binary with the
      # e2e-webdriver feature (embedded WebDriver server, see src-tauri/src/lib.rs) and the
      # src-tauri/tauri.e2e.conf.json capability grant merged in — neither is ever part of
      # the real signed build below. A failure here blocks that OS's signed build/publish.
      - run: pnpm run tauri:build:e2e

      - name: Run Tauri e2e smoke suite
        run: pnpm run test:e2e:tauri

      # Fail loudly (not silently ship a broken/unverifiable auto-updater) if
      # tauri.conf.json still carries the scaffolded placeholder updater
      # endpoint/pubkey — see src-tauri/tauri.conf.json plugins.updater.
      - name: Guard against placeholder updater config
        run: |
          if grep -q 'REPLACE_ORG\|REPLACE_WITH_OUTPUT_OF' src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.endpoints/pubkey still contain scaffolded placeholders — a tagged release would ship with a non-functional or unverifiable auto-updater. Fill in the real GitHub org/repo and run 'npx tauri signer generate' to produce a real keypair before releasing, or set plugins.updater.active to false."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarization + signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Windows code signing (injected via env, not stored in conf)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codex ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          updaterJsonPreferNsis: true
