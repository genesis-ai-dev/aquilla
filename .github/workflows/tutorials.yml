name: Tutorial videos

# Films the tutorial videos against a local stack, as the e2e suite runs, and
# publishes the ones that changed to the docs bucket with videos.json
# (docs/TUTORIAL-VIDEOS.md, AQU-552). The help site reads videos.json; nothing
# here touches the app, its database or its deploy.
#
# Run by hand only, for now. Once a run from this page has gone green and its
# videos have been looked at, add the schedule below so the videos follow the
# app each night; a schedule added before that would fail unseen every night.
#
#   schedule:
#     - cron: "10 20 * * *" # 20:10 UTC, when the fewest partners are at work
#
# A night that films nothing new uploads nothing. A video whose take fails is
# left out and the film that is up stays up; the run goes red and says which.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID   the voice. Without them the videos
#                                              are filmed and published with
#                                              captions and no voice.
#   TUTORIALS_R2_TOKEN                         a Cloudflare API token that can
#                                              write objects in the aquilla-docs
#                                              bucket and nothing else. Only
#                                              read when `publish` is ticked.

on:
  workflow_dispatch:
    inputs:
      only:
        description: Only these videos, by id, separated by commas (empty for all)
        default: ""
      publish:
        description: Upload the videos that changed, and videos.json
        type: boolean
        default: false

# One run at a time: two would both write videos.json.
concurrency:
  group: tutorials
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir auth-worker install --frozen-lockfile
          pnpm --dir sync-worker install --frozen-lockfile

      - uses: ./.github/actions/playwright-chromium

      # The recorder's stack reads and writes a local Postgres (e2e/README.md).
      - name: Start the e2e Postgres
        run: bash scripts/hetzner-ci/ensure-e2e-runtime.sh

      # compose.ts puts each video together with ffmpeg.
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends ffmpeg
          fi

      - name: Say, film and put together the videos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.publish && secrets.TUTORIALS_R2_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: 6a80496d1e59948a9cbaa3c643ba81d7
          ONLY: ${{ inputs.only }}
          PUBLISH: ${{ inputs.publish && '--publish' || '' }}
        run: pnpm tutorials ${ONLY:+--only "$ONLY"} $PUBLISH

      # The videos, their captions and videos.json, to look at before the first
      # publish and whenever a run is not published.
      - name: Keep the videos with the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tutorial-videos-${{ github.run_id }}
          path: .video-staging/tutorials/publish/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the takes' traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tutorial-takes-${{ github.run_id }}
          path: |
            e2e/recordings/output/tutorials-*/
            e2e/recordings/output/*.storyboard.json
            .e2e-logs*/
          if-no-files-found: ignore
          retention-days: 7
