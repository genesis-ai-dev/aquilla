name: Web CI

# FRO-219: This workflow gates every PR with `pnpm run build` (i.e. `tsc -b && vite build`),
# the same chain the deploy uses. A plain `tsc --noEmit` does NOT catch project-reference /
# erasableSyntaxOnly violations (see FRO-213 for a real example that reached main before this
# was in place). Running the full build on every PR is fast enough (<2 min); no separate
# push-only shortcut is needed. Do NOT replace `pnpm run build` with `tsc --noEmit`.
#
# TEST-7: also triggers on push to main so direct pushes don't skip unit tests.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads packageManager field from root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # QW-6/TEST-6: lint enforced in CI
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx tsc -b --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, unit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # FRO-219: must stay as `pnpm run build` (tsc -b chain), never `tsc --noEmit`.
      - run: pnpm run build

  auth-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: auth-worker/pnpm-lock.yaml

      # M0-2: install only the worker's own dir, proving self-contained deps
      - run: pnpm install --frozen-lockfile
        working-directory: auth-worker

      - run: pnpm run type-check
        working-directory: auth-worker

      - run: pnpm test
        working-directory: auth-worker

  sync-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sync-worker/pnpm-lock.yaml

      # M0-2: install only the worker's own dir, proving self-contained deps
      - run: pnpm install --frozen-lockfile
        working-directory: sync-worker

      - run: pnpm run type-check
        working-directory: sync-worker

      # TEST-1: sync-worker tests now run in CI
      - run: pnpm test
        working-directory: sync-worker
