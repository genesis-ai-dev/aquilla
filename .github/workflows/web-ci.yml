name: Web CI

# FRO-219: This workflow gates every PR with `npm run build` (i.e. `tsc -b && vite build`),
# the same chain the deploy uses. A plain `tsc --noEmit` does NOT catch project-reference /
# erasableSyntaxOnly violations (see FRO-213 for a real example that reached main before this
# was in place). Running the full build on every PR is fast enough (<2 min); no separate
# push-only shortcut is needed. Do NOT replace `npm run build` with `tsc --noEmit`.

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # FRO-219: must stay as `npm run build` (tsc -b chain), never `tsc --noEmit`.
      - run: npm run build
