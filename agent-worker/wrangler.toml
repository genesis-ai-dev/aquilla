# The unnamed profile is local-only. Live deploys must select a named profile;
# a bare `wrangler deploy` therefore cannot overwrite the production Worker.
name = "aquilla-agent-sandbox-local"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# agent-worker — the sandbox execution service (AQU-AGENT §1, §6).
#
# This worker runs untrusted agent code inside a Cloudflare Sandbox container
# (one container Durable Object instance per agent session). It holds NO model
# keys and NO business logic — just exec / file / fetch-artifact / destroy.
#
# NO top-level `routes` and NO per-env `routes` here: the harness (auth-worker)
# reaches this worker server-side via AGENT_SANDBOX_URL, never from the browser,
# so no zone route is required for v1. Deploy + eventual zone routes under
# aquilla.app/api/agent/* are an out-of-band task (see ORCHESTRATION "OUT of v1"),
# mirroring the sync-worker convention (CI's token lacks zone-route perms).
#
# Secret (all envs): AGENT_SANDBOX_KEY — shared bearer secret checked on every
# route except /health. Provision with `wrangler secret put AGENT_SANDBOX_KEY`.
# Local dev passes it via `--var AGENT_SANDBOX_KEY:dev-sandbox-key` (dev-stack.ts).
# =============================================================================

# Same CF account as sync-worker / aquilla-db (Frontier R&D). Pinned so
# `wrangler deploy` can't land on the wrong account interactively.
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

[observability]
enabled = true

# PostHog ingest region + *project* token (public — same one shipped in the SPA
# bundle). Enables slow-request / 4xx / 5xx log shipping to PostHog Logs
# (src/posthog-logs.ts). Mirrors auth-worker and sync-worker.
# AQU-854: telemetry moved to PostHog EU Cloud. The host is stated explicitly
# so a deploy never relies on the code default. Live profiles use the verified
# Frontier R&D EU project (282623); keep the token aligned with config/posthog.json.
# The local profile leaves the key empty so development logs stay local.
[vars]
POSTHOG_HOST = "https://eu.i.posthog.com"
POSTHOG_KEY = ""
# AQU-1848: pool admission caps. SANDBOX_MAX_TOTAL must track `max_instances`
# below — the Worker cannot read the container config at runtime, so the two
# move together. SANDBOX_MAX_PER_TENANT keeps one org from draining the pool;
# SANDBOX_POOL_WAIT_MS is how long a request waits for a slot before it returns
# `pool_busy`. Local dev keeps the pool tiny so the queueing path is easy to
# exercise by hand (see the ticket's test checklist).
SANDBOX_MAX_TOTAL = "2"
SANDBOX_MAX_PER_TENANT = "1"
SANDBOX_POOL_WAIT_MS = "20000"

# The container-backed Durable Object. `image = "./Dockerfile"` builds the
# sandbox image; `instance_type` sizes each container (contract §6).
# NOTE: `sleepAfter` is NOT a wrangler key — it is a property on the `Sandbox`
# class (inherited from `Container`), so it is set in src/index.ts (AQU-1848).
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 20

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

# AQU-1848: the admission ledger. One singleton instance counts every in-flight
# container so the caps are enforced before a container start can fail.
[[durable_objects.bindings]]
name = "SANDBOX_POOL"
class_name = "SandboxPool"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SandboxPool"]

# Agent artifacts / media blobs (same bucket the sync-worker binds). The
# fetch-artifact route reads objects from here and writes them into /workspace.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"

# ---------------------------------------------------------------------------
# Development — mirrors sync-worker's -dev R2 naming. Each named env must
# re-declare every binding (they are NOT inherited from the top level).
# Deploy: `wrangler deploy --env development`.
# ---------------------------------------------------------------------------
[env.development]
name = "aquilla-agent-sandbox-dev"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

[env.development.observability]
enabled = true

[env.development.vars]
POSTHOG_HOST = "https://eu.i.posthog.com"
POSTHOG_KEY = "phc_qy5gb7wTaW5RbmMW8SEyQPSLKtYFtUobaqKZWiUs7cBt"
# AQU-1848: dev mirrors `max_instances = 5` below. The ticket's first
# acceptance criterion is checked here by dropping both numbers to 2 and
# starting a third run.
SANDBOX_MAX_TOTAL = "5"
SANDBOX_MAX_PER_TENANT = "2"
SANDBOX_POOL_WAIT_MS = "20000"

[[env.development.containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 5

[[env.development.durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[env.development.durable_objects.bindings]]
name = "SANDBOX_POOL"
class_name = "SandboxPool"

[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[env.development.migrations]]
tag = "v2"
new_sqlite_classes = ["SandboxPool"]

[[env.development.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots-dev"
[env.production]
name = "aquilla-agent-sandbox"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

[env.production.build]
command = "bash ../scripts/verify-deploy-branch.sh release"

[env.production.observability]
enabled = true

[env.production.vars]
POSTHOG_HOST = "https://eu.i.posthog.com"
POSTHOG_KEY = "phc_qy5gb7wTaW5RbmMW8SEyQPSLKtYFtUobaqKZWiUs7cBt"
# AQU-1848: SANDBOX_MAX_TOTAL tracks `max_instances = 20` below. A per-tenant
# cap of 3 is more than any single UI flow needs (one agent run plus a couple of
# imports) and still leaves 17 slots for the rest of the platform when one
# tenant is at its cap.
SANDBOX_MAX_TOTAL = "20"
SANDBOX_MAX_PER_TENANT = "3"
SANDBOX_POOL_WAIT_MS = "20000"

[[env.production.containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 20

[[env.production.durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_POOL"
class_name = "SandboxPool"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["SandboxPool"]

[[env.production.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"
