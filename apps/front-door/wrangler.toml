# Front-door Worker for the Aquilla monorepo (AD-11; spec §21-monorepo.md).
#
# Workers Routes maps every known app slug to its own Worker
# (aquilla.app/<slug>/* → aquilla-<slug>). The front-door catches every
# unclaimed path on the apex. It is NOT a dispatcher: there are no
# service bindings to per-app Workers here, on purpose (avoids coupling
# every app deploy to a front-door redeploy).
#
# Behavior (see src/index.ts):
#   GET /            → 302 redirect to /projects/
#   GET /<slug>      → 301 to /<slug>/ for every entry in routes.json
#   GET /project/*   → 301 to /w/project/* (legacy workspace URL)
#   GET /debug, …    → 301 to /w/<path> (other legacy workspace URLs)
#   GET /__routes    → JSON dump of routes.json (debug aid)
#   anything else    → 404 (Workers Routes claims real app paths upstream)
#
# routes.json is imported at build time (rules + bundler resolve it through
# the relative path in src/index.ts). Adding an app means: edit routes.json,
# redeploy the front-door.

name = "aquilla-front-door"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Top-level (no env flag) defaults to prod for symmetry with the legacy
# workers. Prefer --env=production / --env=staging / --env=preview.
# routes = ["aquilla.app/*"]  # See [env.production].routes below.

[vars]
ENV = "prod"

# Static assets — favicons + OG image. Workers Assets serves any file
# that matches the request path; unknown paths fall through to the
# Worker script (src/index.ts) which handles redirects + 404. This
# replaces the favicon-serving job Cloudflare Pages used to do.
[assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Production — `wrangler deploy --env production`
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-prod-front-door"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# Wildcard catch-all: every aquilla.app path not claimed by a more
# specific app route lands here. Per-app Workers Routes
# (`aquilla.app/<slug>/*`) take precedence — Cloudflare picks the most
# specific match, so /login/* still goes to aquilla-prod-login etc.
# Front-door serves favicons + OG image via Workers Assets, 301s
# legacy workspace URLs (/project/*, /debug, …) to /w/<path>, and
# 404s everything else. This replaces the Pages SPA fallback
# (`/*` → `index.html`) that previously served the legacy bundle at
# the apex.
routes = ["aquilla.app/*"]

[env.production.vars]
ENV = "prod"

[env.production.assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Staging — `wrangler deploy --env staging`
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-dev-front-door"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["dev.aquilla.app/*"]  # Claimed in staging via Workers Routes

[env.staging.vars]
ENV = "preview"

[env.staging.assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Preview (per-PR) — CI substitutes `__PR__` with the PR number.
# ---------------------------------------------------------------------------
[env.preview]
name = "aquilla-pr-__PR__-front-door"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["pr-__PR__.aquilla.app/*"]  # Claimed in preview via Workers Routes

[env.preview.vars]
ENV = "preview"
PR = "__PR__"

[env.preview.assets]
directory = "./public"
binding = "ASSETS"
