# wrangler.toml for apps/login/ (Phase 3b).
#
# Workers Assets binding serves the Vite SPA built into ./dist; the
# Worker script under src/worker.ts wraps the asset response with the
# boot-time env-binding assertion + baseline security headers (AD-11
# §"Environment binding hygiene").
#
# Mounted under `/login/*` per routes.json.

name = "aquilla-login"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Same CF account as the rest of the monorepo workers. Pinned to avoid
# wrangler interactive account-pick prompts.
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Top-level (no env flag) defaults to prod for symmetry with the legacy
# workers. Prefer `--env=production` / `--env=staging` / `--env=preview`
# explicitly; do not rely on these defaults.
# routes = ["aquilla.app/login/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[vars]
ENV = "prod"
# `VITE_AUTH_BASE` is consumed at *build time* by Vite, not at runtime. We
# document it as a `[vars]` for parity with the runtime env-var pattern
# the other workers use, but it's effectively a build-time string the
# bundler inlines via import.meta.env. Override in CI by exporting
# VITE_AUTH_BASE before `pnpm build`.
VITE_AUTH_BASE = "https://aquilla-frontier-server.blue-darkness-7674.workers.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA fallback: any unknown sub-path serves index.html so client routing
# (basename="/login") can take over.
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Production — `wrangler deploy --env production`
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-prod-login"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["aquilla.app/login/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.production.vars]
ENV = "prod"
VITE_AUTH_BASE = "https://api.aquilla.app/api/identity"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Staging — `wrangler deploy --env staging`
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-dev-login"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["dev.aquilla.app/login/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.staging.vars]
ENV = "preview"
VITE_AUTH_BASE = "https://aquilla-frontier-server.blue-darkness-7674.workers.dev"

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Preview (per-PR) — CI substitutes `__PR__` with the PR number at deploy
# time. Resource names land on the `aquilla-pr-<N>-` prefix that the
# boot-time env assertion helper (packages/errors) expects under
# ENV=preview.
# ---------------------------------------------------------------------------
[env.preview]
name = "aquilla-pr-__PR__-login"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["pr-__PR__.aquilla.app/login/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.preview.vars]
ENV = "preview"
PR = "__PR__"
VITE_AUTH_BASE = "https://aquilla-frontier-server.blue-darkness-7674.workers.dev"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
