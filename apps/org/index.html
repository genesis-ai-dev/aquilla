<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/org/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organization · Aquilla</title>
    <!--
      Pre-paint theme bootstrap. Keep in sync with packages/ui/src/theme-mode.tsx
      (THEME_STORAGE_KEY = "codex-theme").
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("codex-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || ((stored === "system" || !stored) && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
