# Cloudflare Worker config for apps/projects/ (AD-11; spec §21-monorepo.md).
#
# Serves the Vite-built SPA under /projects/* via the Workers Assets
# binding. Routes are claimed at the Workers Routes layer (no front-door
# dispatch); update routes.json when changing the mount path.

name = "aquilla-projects"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Workers Assets binding — points at the Vite build output.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Top-level (no env flag) defaults to prod for symmetry with the other
# workers. Prefer --env=production / --env=staging / --env=preview explicitly.
# routes = ["aquilla.app/projects/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[vars]
ENV = "prod"
# Per-app build-time env. The Vite build reads VITE_AUTH_BASE so the
# bundled JS calls the right auth-worker host. These vars are exposed to
# the Worker too in case the SPA-fallback handler ever needs them.
VITE_AUTH_BASE = "https://codex-auth-worker.blue-darkness-7674.workers.dev"
VITE_SYNC_WORKER_HOST = "codex-sync-worker.blue-darkness-7674.workers.dev"

# ---------------------------------------------------------------------------
# Production — wrangler deploy --env production
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-prod-projects"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["aquilla.app/projects/*"]  # Claimed in production via Workers Routes (zone aquilla.app on CF account)

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.production.vars]
ENV = "prod"
VITE_AUTH_BASE = "https://codex-auth-worker.blue-darkness-7674.workers.dev"
VITE_SYNC_WORKER_HOST = "codex-sync-worker.blue-darkness-7674.workers.dev"

# ---------------------------------------------------------------------------
# Staging — wrangler deploy --env staging
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-dev-projects"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["dev.aquilla.app/projects/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.staging.vars]
ENV = "preview"
VITE_AUTH_BASE = "https://codex-auth-worker-staging.blue-darkness-7674.workers.dev"
VITE_SYNC_WORKER_HOST = "codex-sync-worker-staging.blue-darkness-7674.workers.dev"

# ---------------------------------------------------------------------------
# Preview (per-PR) — CI substitutes __PR__ at deploy time.
# ---------------------------------------------------------------------------
[env.preview]
name = "aquilla-pr-__PR__-projects"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["pr-__PR__.aquilla.app/projects/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.preview.vars]
ENV = "preview"
PR = "__PR__"
VITE_AUTH_BASE = "https://codex-auth-worker-staging.blue-darkness-7674.workers.dev"
VITE_SYNC_WORKER_HOST = "codex-sync-worker-staging.blue-darkness-7674.workers.dev"
