# wrangler.toml for apps/signup/ (Phase 3b). See apps/login/wrangler.toml
# for rationale comments.

name = "aquilla-signup"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# routes = ["aquilla.app/signup/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[vars]
ENV = "prod"
VITE_AUTH_BASE = "https://aquilla-frontier-server.blue-darkness-7674.workers.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Production — `wrangler deploy --env production`
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-prod-signup"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["aquilla.app/signup/*"]  # Claimed in production via Workers Routes (zone aquilla.app on CF account)

[env.production.vars]
ENV = "prod"
VITE_AUTH_BASE = "https://api.aquilla.app/api/identity"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run the Worker first for the index.html-shaped paths so we can
# override Cache-Control on the SPA shell. Hashed asset requests still
# go direct via Workers Assets (fast).
run_worker_first = ["/signup/*", "!/signup/assets/*"]

# ---------------------------------------------------------------------------
# Staging — `wrangler deploy --env staging`
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-dev-signup"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["dev.aquilla.app/signup/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.staging.vars]
ENV = "preview"
VITE_AUTH_BASE = "https://aquilla-frontier-server.blue-darkness-7674.workers.dev"

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Preview (per-PR) — CI substitutes `__PR__` with the PR number at deploy
# time. Resource names land on the `aquilla-pr-<N>-` prefix that the
# boot-time env assertion helper (packages/errors) expects under
# ENV=preview.
# ---------------------------------------------------------------------------
[env.preview]
name = "aquilla-pr-__PR__-signup"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["pr-__PR__.aquilla.app/signup/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.preview.vars]
ENV = "preview"
PR = "__PR__"
VITE_AUTH_BASE = "https://aquilla-frontier-server.blue-darkness-7674.workers.dev"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
