name = "aquilla-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Same CF account as aquilla-identity. Pinned so `wrangler deploy`
# doesn't prompt interactively and lands on the wrong account by accident.
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Legacy binding retained so existing Durable Object migrations remain valid.
# The exported class returns 410; no route dispatches to this DO.
[[durable_objects.bindings]]
name = "FileSync"
class_name = "FileSync"

# Per-project DO (AD-1). Holds focus locks + presence + an event-fanout
# relay. Transient state only; no D1/R2 writes from inside the DO itself.
[[durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

# R2 holds media/original-import blobs. It no longer stores Y.Doc state.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"
# The legacy `codex-snapshots` bucket still exists in CF (created during
# the codex-* era) but is no longer bound here. New writes land in
# aquilla-snapshots; the old bucket stays untouched as a read-only
# archive in case any data needs to be retrieved later.
# For local `wrangler dev`, wrangler will use a local simulator if the bucket doesn't exist.

# Shared D1 with aquilla-identity. Schema is owned by identity
# (apps/identity/migrations/0001_initial.sql); sync-worker is a writer-
# only against the `files`, `cells`, `events`, `cell_validators`,
# `checkpoints` tables. Migration application happens via identity's
# deploy step.
[[d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db"
# database_id is populated by `wrangler d1 create aquilla-db` — must match
# apps/identity/wrangler.toml.
database_id = "11828e9d-998b-4d3f-a405-91d9f624f94a"

# Auth:
#   SYNC_SECRET_KEY (shared with aquilla-identity for sync-token JWT
#   signing — distinct from identity's main SECRET_KEY) and
#   ALLOW_UNAUTHENTICATED live in .dev.vars for local dev (see
#   .dev.vars.example) and are provisioned via `wrangler secret put` in
#   production. Deploying with neither set means strict auth (reject all
#   WS connections without a valid sync-token JWT) — the intended prod
#   default. If you need to disable auth in prod for some reason, set
#   ALLOW_UNAUTHENTICATED="true" via `wrangler secret put`.
#
# Voice clone (Seed-VC) — POST /api/v1/voice/convert proxies to the Modal
# endpoint in infra/modal/seed_vc.py. Both are optional; if unset the route
# returns 503. Provision per env (the URL is the deployed Modal /convert URL,
# the token must equal the Modal `seed-vc-auth` secret's SEED_VC_TOKEN):
#   wrangler secret put SEED_VC_URL    [--env staging|production]
#   wrangler secret put SEED_VC_TOKEN  [--env staging|production]
# For local dev add both to .dev.vars.

# ---------------------------------------------------------------------------
# Staging environment — physically separate D1, R2, DO namespace.
# Auth model unchanged: same SYNC_SECRET_KEY as prod, same identity worker
# issues sync-tokens. A logged-in user can use the staging frontend and
# their writes land in aquilla-staging / aquilla-snapshots-staging, leaving
# prod data untouched.
#
# Deploy: `wrangler deploy --env staging` (CI does this on push to dev).
# Secrets: after first deploy, copy SYNC_SECRET_KEY from prod with
#   `wrangler secret put SYNC_SECRET_KEY --env staging`
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-sync-worker-staging"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# Mounted under the apex via Workers Routes so browsers reach it through the
# real `aquilla.app` zone (Safari is unreliable against `*.workers.dev`). The
# worker strips the `/api/sync` prefix (see src/index.ts). CI deploys strip
# route lines (the CI token lacks zone-route perms); the route is created
# out-of-band via dashboard / local `wrangler deploy`.
routes = ["dev.aquilla.app/api/sync/*"]

[[env.staging.durable_objects.bindings]]
name = "FileSync"
class_name = "FileSync"

[[env.staging.durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

[[env.staging.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots-staging"

[[env.staging.d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db-staging"
database_id = "c995bf9a-97c0-4966-a112-053a2d04d8f9"

# ---------------------------------------------------------------------------
# Production — mirrors the top-level config explicitly so the unified
# matrix workflow (deploy-apps-prod.yml) can call `wrangler deploy
# --env=production`. Worker name is intentionally the same as the bare
# top-level `aquilla-sync-worker` so existing DO state stays addressable.
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-sync-worker"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# Browser-facing apex mount (see [env.staging] note). The worker strips the
# `/api/sync` prefix in src/index.ts. Route is created out-of-band; CI strips
# route lines before deploying.
routes = ["aquilla.app/api/sync/*"]

[[env.production.durable_objects.bindings]]
name = "FileSync"
class_name = "FileSync"

[[env.production.durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

[[env.production.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"

[[env.production.d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db"
database_id = "11828e9d-998b-4d3f-a405-91d9f624f94a"
