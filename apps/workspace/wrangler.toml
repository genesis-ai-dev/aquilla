# wrangler.toml for apps/workspace/ (Phase 3a-final).
#
# Workers Assets binding serves the Vite SPA built into ./dist; the
# Worker script under src/worker.ts wraps the asset response with the
# boot-time env-binding assertion + baseline security headers (AD-11
# §"Environment binding hygiene").
#
# Mounted under `/w/*` per routes.json — AD-11's deliberate SPA exception.

name = "aquilla-workspace"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Same CF account as the rest of the monorepo workers. Pinned to avoid
# wrangler interactive account-pick prompts.
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Top-level (no env flag) defaults to prod for symmetry with the legacy
# workers. Prefer `--env=production` / `--env=staging` / `--env=preview`
# explicitly; do not rely on these defaults.
# routes = ["aquilla.app/w/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[vars]
ENV = "prod"
# Build-time Vite env vars; the bundler inlines these via import.meta.env.
# Override in CI by exporting before `pnpm build`.
VITE_AUTH_BASE = "https://codex-auth-worker.blue-darkness-7674.workers.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA fallback: any unknown sub-path serves index.html so client routing
# (React Router under /w/*) can take over.
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Production — `wrangler deploy --env production`
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-prod-workspace"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# Workspace at /w/* (per routes.json). Vite base = /w/, BrowserRouter
# basename = /w (runtime-detected in main.tsx so the same bundle still
# works at apex paths served by the legacy Pages build). The aquilla.app
# zone IS on the CF account — the original "TODO" comment was stale.
routes = ["aquilla.app/w/*"]

[env.production.vars]
ENV = "prod"
VITE_AUTH_BASE = "https://api.aquilla.app/api/identity"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# By default Workers Assets intercepts asset requests before the Worker
# script runs, which would skip our `/w/` → `/projects` landing redirect
# in src/worker.ts. `run_worker_first` for the apex paths makes the
# Worker handle them; everything else (assets, sub-routes) still gets
# the auto-served path. Pattern syntax matches Workers Assets'
# `run_worker_first` array form.
run_worker_first = ["/w", "/w/"]

# ---------------------------------------------------------------------------
# Staging — `wrangler deploy --env staging`
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-dev-workspace"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["dev.aquilla.app/w/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.staging.vars]
ENV = "preview"
VITE_AUTH_BASE = "https://codex-auth-worker.blue-darkness-7674.workers.dev"

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Preview (per-PR) — CI substitutes `__PR__` with the PR number at deploy
# time. Resource names land on the `aquilla-pr-<N>-` prefix that the
# boot-time env assertion helper (packages/errors) expects under
# ENV=preview.
# ---------------------------------------------------------------------------
[env.preview]
name = "aquilla-pr-__PR__-workspace"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# routes = ["pr-__PR__.aquilla.app/w/*"]  # TODO: uncomment after aquilla.app zone is provisioned in Cloudflare

[env.preview.vars]
ENV = "preview"
PR = "__PR__"
VITE_AUTH_BASE = "https://codex-auth-worker.blue-darkness-7674.workers.dev"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
