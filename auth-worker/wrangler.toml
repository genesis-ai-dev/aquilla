name = "codex-auth-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Single D1 owns everything codex-web touches — identity, orgs, projects,
# members, invites, file/cell projections. Brand-new schema (no shared
# tables with the legacy frontier-server's frontier-db-v2). Migrations
# under `migrations/` are wrangler-applied on deploy.
#
# Schema ownership lives here; sync-worker binds the same D1 but does NOT
# declare migrations_dir (wrangler tracks applied migrations per file in a
# `d1_migrations` row, so a second worker would no-op anyway — keeping a
# single owner avoids confusion).
[[d1_databases]]
binding = "CODEX_DB"
database_name = "codex"
# database_id is filled in after `wrangler d1 create codex`.
database_id = "REPLACE_WITH_PROD_CODEX_D1_ID"
migrations_dir = "migrations"

# Secrets (provisioned via `wrangler secret put`, never committed):
#   SECRET_KEY      — frontier JWT signing key. Rotate to a fresh value for
#                     the clean break; legacy frontier-server tokens will no
#                     longer verify here (acceptable — no shared users yet).
#   SYNC_SECRET_KEY — signs /sync-token JWTs AND authenticates admin calls
#                     to codex-sync-worker. MUST match codex-sync-worker.
#   RESEND_API_KEY  — used by /password-reset/request to send email.
# Plain vars: see types.ts for the full list.

[vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@frontierrnd.com"
BASE_URL = "https://codex-web.pages.dev"
ENVIRONMENT = "production"
# Admin URL for fire-and-forget archive / R2 cleanup notifications. Used by
# POST /projects/:id/archive and DELETE /projects/:id/files/:fileId.
SYNC_WORKER_URL = "https://codex-sync-worker.blue-darkness-7674.workers.dev"

# ---------------------------------------------------------------------------
# Staging — physically separate D1 (codex-staging) so experiments don't
# pollute prod identities. SECRET_KEY + SYNC_SECRET_KEY may be either shared
# with prod (cross-env testing convenience) or rotated; that's a deploy
# decision, not a code one.
# ---------------------------------------------------------------------------
[env.staging]
name = "codex-auth-worker-staging"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

[[env.staging.d1_databases]]
binding = "CODEX_DB"
database_name = "codex-staging"
database_id = "REPLACE_WITH_STAGING_CODEX_D1_ID"
migrations_dir = "migrations"

[env.staging.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@frontierrnd.com"
BASE_URL = "https://dev.codex-web.pages.dev"
ENVIRONMENT = "staging"
SYNC_WORKER_URL = "https://codex-sync-worker-staging.blue-darkness-7674.workers.dev"
