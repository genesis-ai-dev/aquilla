name = "aquilla-identity"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# Browser-facing mount: api.aquilla.app/identity/* (and api.aquilla.app/chat/*).
# Auth uses bearer tokens, never cookies, so cross-subdomain calls from
# web.aquilla.app are fine — see CORS_HEADERS in src/index.ts. Safari drops
# *.workers.dev WebSockets, which is why the API lives on a real zone and
# not the workers.dev URL. The worker strips the /identity or /chat prefix
# (index.ts) before handing off to the route handlers.
#
# =============================================================================
# ROUTE / ENV CONVENTION — read this before editing routes
# =============================================================================
# Routes for every environment live in `[env.<name>]` blocks below. This
# file IS the source of truth for routes — do NOT add or remove routes via
# the Cloudflare dashboard.
#
# GitHub Actions and local deploy scripts always pass an explicit named
# environment. The deploy token must have permission to synchronize the routes
# declared by that environment. A route-permission failure is a failed deploy,
# never a reason to retry with the default profile.
#
# Examples:
#   pnpm run deploy:aquilla:auth        # = wrangler deploy --env=production
#   (cd auth-worker && wrangler deploy --env=staging)
# These commands sync the worker's routes to match the env block — they
# ADD routes new to the list and REMOVE routes that have been deleted.
#
# To add or change a route:
#   1. Edit `routes = [...]` in the relevant `[env.<name>]` below.
#   2. Run the deploy command above.
#   3. Commit the wrangler.toml change.
#
# =============================================================================
#
# Chat: /chat/* on api.aquilla.app is owned by this worker (folded in from
# the former aquilla-chat-worker on 2026-05-26 — same JWT secret, one
# worker). OPENROUTER_API_KEY must be set on aquilla-identity (and
# aquilla-dev-identity for development) via `wrangler secret put`. The legacy
# `aquilla.app/api/chat/*` route still lives on codex-chat-worker; once
# this worker's `api.aquilla.app/chat/*` is verified the legacy route can
# be detached.

# auth-worker is the full identity surface and owns the complete schema
# (identity + orgs + projects + members + invites + file/cell projections).
# The datastore is Postgres (Neon), reached through the D1-compatible shim
# (db/shim/postgres.ts) over Hyperdrive — index.ts builds AQUILLA_PG from it.
# D1 has been removed as a datastore (the D1→Neon cutover is complete); the
# worker fails fast if HYPERDRIVE is absent rather than falling back to D1.
#
# Schema management is by hand against Neon, NOT D1 migrations:
#   set -a; . ./.env; set +a            # load Neon creds
#   npx tsx scripts/pg.ts db/postgres/schema.sql
# The legacy D1 files under `migrations/` are retained only as the historical
# record the Postgres schema was derived from. For local `wrangler dev`,
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE points Hyperdrive at a
# local/branch Postgres (see scripts/dev-stack.ts, scripts/e2e-up.ts).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

# R2 bucket for agent-attached artifacts (routes/agent-artifacts.ts). Same
# bucket sync-worker + agent-worker bind as SNAPSHOTS, so the harness's
# load_artifact tool reads back what the SPA composer uploads. Named deployed
# environments re-declare this binding below; the top-level binding supports
# the default/local profile only.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"

# Keep the top-level email binding for default-profile compatibility. Every live
# named environment also declares its own binding because Wrangler environments
# do not inherit top-level bindings.
[[send_email]]
name = "EMAIL"

# Secrets (provisioned via `wrangler secret put`, never committed):
#   SECRET_KEY      — identity access-token signing key.
#   SYNC_SECRET_KEY — signs /sync-token JWTs. MUST match aquilla-sync-worker.
#   OPENROUTER_API_KEY — Bearer key forwarded by /api/v1/chat/completions
#                        to OpenRouter (folded in from aquilla-chat-worker).
#   AGENT_SANDBOX_KEY  — shared bearer secret for the sandbox worker
#                        (aquilla-agent-sandbox). AQU-AGENT §2/§6. Unset →
#                        run_code/load_artifact/read_sandbox_file return a clear
#                        "sandbox unavailable" tool error (the run still runs).
#   FRONTIER_D1_DATABASE_ID — source frontier-db-v2 UUID.
#   FRONTIER_D1_API_TOKEN   — source token scoped to D1 Read only.
#   GITLAB_ADMIN_TOKEN      — trusted service token for access reconstruction.
# Plain vars: see types.ts for the full list.
#
# Outbound email (password reset + project invites) goes through Cloudflare
# Email Service via the [[env.*.send_email]] bindings below — no API key.
# ONE-TIME SETUP: the sending domain (support.aquilla.app, see EMAIL_FROM) must be
# onboarded under Compute > Email Service > Email Sending in the dashboard
# (Frontier R&D account) or sends fail with E_SENDER_NOT_VERIFIED. The
# binding is deliberately ABSENT from the top-level and e2e profiles so
# local `wrangler dev` (pinned wrangler 3.x predates Email Service local
# simulation) keeps email as a no-op — see src/services/email.ts.

[observability]
enabled = true

# Smart Placement: run the Worker near its backend (Hyperdrive→Neon, US-side)
# instead of at the requester's edge PoP. Primary reason is geo: outbound
# fetches to OpenRouter then egress from a US region, so Anthropic models stop
# returning 403 "not available in your region" for users in geo-restricted
# locales (e.g. the Philippines hit a Manila/Singapore PoP). Bonus: this worker
# is DB-heavy, so co-locating with Postgres also cuts round-trip latency.
[placement]
mode = "smart"

# Monday.com integration: cron flush of debounced board-link pushes
# (src/index.ts scheduled() → lib/monday/push.ts flushDirtyLinks, cap 20).
# NOTE: like placement/observability, [triggers] is NOT inherited by env
# blocks — keep the env-block copies below in sync.
[triggers]
crons = ["*/5 * * * *"]

[vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@support.aquilla.app"
# Team inbox for the public "book a call" form (routes/contact.ts). Must be a
# routed destination address in Cloudflare Email Routing.
CONTACT_EMAIL = "joel@frontierrnd.com"
# EMAIL_FROM is an unmonitored noreply@, so replies are routed here instead.
# This address MUST be wired to a human in Cloudflare Email Routing, or a
# reply lands nowhere (see services/email.ts DEFAULT_REPLY_TO).
EMAIL_REPLY_TO = "support@aquilla.app"
# Public community invite. When set, welcome emails render the Discord CTA and
# point support at it (a real person answers there). Leave unset on stealth
# deploys to omit it.
DISCORD_INVITE_URL = "https://discord.gg/T2EndwXe4W"
# BASE_URL points at the SPA — used to construct password-reset / invite
# links sent in email. The apex aquilla.app is the canonical app domain.
BASE_URL = "https://aquilla.app"
SYNC_WORKER_URL = "https://api.aquilla.app/sync"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "production"
# AQU-713 legacy identity bridge. Production enables JIT migration by default;
# all three migration secrets above must be provisioned before deployment.
LEGACY_USER_MIGRATION_ENABLED = "true"
FRONTIER_D1_ACCOUNT_ID = "6a80496d1e59948a9cbaa3c643ba81d7"
GITLAB_URL = "https://git.genesisrnd.com"
# AQU-AGENT §6 — sandbox worker (aquilla-agent-sandbox) base URL for the agent's
# code-exec tools. Left UNSET at top level until the sandbox worker is deployed:
# the harness degrades to a clear "sandbox unavailable" tool error when absent,
# so shipping without it is safe. Set it (and the AGENT_SANDBOX_KEY secret) once
# the sandbox worker has a stable URL. Dev/e2e point at the local worker below.
# AGENT_SANDBOX_URL = "https://<aquilla-agent-sandbox-url>"
# Site-wide admin surface (/api/v2/admin/*) identity, by ACCOUNT EMAIL — usernames
# don't matter. Separate axis from the org role ladder; see platform-admin.ts.
# ADMIN_REQUIRE_ELEVATION="true" adds the emailed 6-digit step-up code (→ 6h
# session); bypassed under WRANGLER_LOCAL=1 (local dev-stack / e2e) so the local
# console stays open. NOTE: deployed via `wrangler deploy` (CI main) which reads
# THIS top-level block, so it must carry both to harden prod.
ADMIN_EMAILS = "ryderwishart@gmail.com,danieljlosey@gmail.com,the.disciplexiii@gmail.com,joel@frontierrnd.com,jade@frontierrnd.com"
ADMIN_REQUIRE_ELEVATION = "true"
# Monday.com integration (non-secret ids; empty defaults — set real values per
# deploy). Secrets MONDAY_CLIENT_SECRET + MONDAY_SIGNING_SECRET go through
# `wrangler secret put` (and auth-worker/.dev.vars locally).
MONDAY_CLIENT_ID = ""
MONDAY_APP_ID = ""
MONDAY_APP_SLUG = ""
MONDAY_REDIRECT_URI = "https://aquilla.app/oauth/callback"

# ---------------------------------------------------------------------------
# Production environment — owns routes on api.aquilla.app for the identity
# and chat surfaces. Same worker name as top-level (aquilla-identity), so
# `wrangler deploy` (CI, code-only) and `wrangler deploy --env=production`
# (local, code + routes) target the same Worker. Bindings + vars are
# re-declared because env blocks don't inherit them.
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-identity"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = [
  "api.aquilla.app/identity/*",
  "api.aquilla.app/chat/*",
]

# See top-level [placement] — keep env blocks in sync (they don't inherit it).
[env.production.placement]
mode = "smart"

# See top-level [triggers] — env blocks don't inherit crons either.
[env.production.triggers]
crons = ["*/5 * * * *"]

# Like placement, observability is NOT inherited by env blocks — without this,
# production has Workers Logs disabled and 4xx/5xx are invisible.
[env.production.observability]
enabled = true

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

[[env.production.r2_buckets]]
