name = "aquilla-identity"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# Browser-facing mount: api.aquilla.app/identity/* (and api.aquilla.app/chat/*).
# Auth uses bearer tokens, never cookies, so cross-subdomain calls from
# web.aquilla.app are fine — see CORS_HEADERS in src/index.ts. Safari drops
# *.workers.dev WebSockets, which is why the API lives on a real zone and
# not the workers.dev URL. The worker strips the /identity or /chat prefix
# (index.ts) before handing off to the route handlers.
#
# =============================================================================
# ROUTE / ENV CONVENTION — read this before editing routes
# =============================================================================
# Routes for every environment live in `[env.<name>]` blocks below. This
# file IS the source of truth for routes — do NOT add or remove routes via
# the Cloudflare dashboard.
#
# Why the top-level config has no `routes` block:
#   CI's API token lacks `Zone.Workers Routes:Edit` on the aquilla.app zone,
#   so a routed deploy fails with auth error [10000]. CI runs bare
#   `wrangler deploy` (which uses this top-level config) and only ships CODE.
#
# Routes are applied by a LOCAL deploy with a zone-perm token:
#   pnpm run deploy:aquilla:auth        # = wrangler deploy --env=production
#   (cd auth-worker && wrangler deploy --env=staging)
# These commands sync the worker's routes to match the env block — they
# ADD routes new to the list and REMOVE routes that have been deleted.
#
# To add or change a route:
#   1. Edit `routes = [...]` in the relevant `[env.<name>]` below.
#   2. Run the deploy command above.
#   3. Commit the wrangler.toml change.
#
# Future state: when CI's token is upgraded with zone-route perms,
# `.github/workflows/deploy-workers.yml` can switch to
# `wrangler deploy --env=production`, after which routes ship on every push
# to main. Until then, route changes are a deliberate local step.
# =============================================================================
#
# Chat: /chat/* on api.aquilla.app is owned by this worker (folded in from
# the former aquilla-chat-worker on 2026-05-26 — same JWT secret, one
# worker). OPENROUTER_API_KEY must be set on aquilla-identity (and
# aquilla-dev-identity for staging) via `wrangler secret put`. The legacy
# `aquilla.app/api/chat/*` route still lives on codex-chat-worker; once
# this worker's `api.aquilla.app/chat/*` is verified the legacy route can
# be detached.

# Phase D: auth-worker is the full identity surface. AQUILLA_DB owns the
# complete schema (identity + orgs + projects + members + invites + file/cell
# projections). Migrations under `migrations/` are applied automatically on
# deploy — see the CI step that runs `wrangler d1 migrations apply aquilla-db`.
# Schema ownership lives here; sync-worker binds the same D1 but does NOT
# declare migrations_dir.
[[d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db"
database_id = "11828e9d-998b-4d3f-a405-91d9f624f94a"
migrations_dir = "migrations"

# Secrets (provisioned via `wrangler secret put`, never committed):
#   SECRET_KEY      — frontier JWT signing key. MUST match prod
#                     frontier-server so access tokens are interchangeable.
#   SYNC_SECRET_KEY — signs /sync-token JWTs. MUST match aquilla-sync-worker.
#   RESEND_API_KEY  — used by /password-reset/request to send email.
#   OPENROUTER_API_KEY — Bearer key forwarded by /api/v1/chat/completions
#                        to OpenRouter (folded in from aquilla-chat-worker).
# Plain vars: see types.ts for the full list.

[vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
# BASE_URL points at the SPA — used to construct password-reset / invite
# links sent in email. The apex aquilla.app is the canonical app domain.
BASE_URL = "https://aquilla.app"
SYNC_WORKER_URL = "https://api.aquilla.app/sync"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "production"
# Comma-separated username allowlist for the site-wide admin surface
# (/api/v2/admin/*). Separate axis from the org role ladder — see
# src/middleware/platform-admin.ts.
PLATFORM_ADMINS = "daniel2,dadukhankevin,ryder,ryder-aquilla,ryder-aquilla-2,ryder-aquilla-3"

# ---------------------------------------------------------------------------
# Production environment — owns routes on api.aquilla.app for the identity
# and chat surfaces. Same worker name as top-level (aquilla-identity), so
# `wrangler deploy` (CI, code-only) and `wrangler deploy --env=production`
# (local, code + routes) target the same Worker. Bindings + vars are
# re-declared because env blocks don't inherit them.
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-identity"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = [
  "api.aquilla.app/identity/*",
  "api.aquilla.app/chat/*",
]

[[env.production.d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db"
database_id = "11828e9d-998b-4d3f-a405-91d9f624f94a"
migrations_dir = "migrations"

[env.production.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
BASE_URL = "https://aquilla.app"
SYNC_WORKER_URL = "https://api.aquilla.app/sync"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "production"
PLATFORM_ADMINS = "daniel2,dadukhankevin,ryder,ryder-aquilla,ryder-aquilla-2,ryder-aquilla-3"

# ---------------------------------------------------------------------------
# Staging environment — physically separate D1 (frontier-db-v2-staging) so
# experiments don't pollute prod identities. Same SECRET_KEY + SYNC_SECRET_KEY
# as prod so tokens minted against staging still verify against prod workers
# during cross-env testing (set via `wrangler secret put --env staging`).
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-dev-identity"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = [
  "api.dev.aquilla.app/identity/*",
  "api.dev.aquilla.app/chat/*",
]

[[env.staging.d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db-staging"
database_id = "c995bf9a-97c0-4966-a112-053a2d04d8f9"
migrations_dir = "migrations"

[env.staging.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
BASE_URL = "https://dev.aquilla.app"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "staging"
PLATFORM_ADMINS = "daniel2,dadukhankevin,ryder,ryder-aquilla,ryder-aquilla-2,ryder-aquilla-3"
