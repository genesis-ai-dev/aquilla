name = "aquilla-identity"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
# Browser-facing mount: api.aquilla.app/identity/* (and api.aquilla.app/chat/*).
# Auth uses bearer tokens, never cookies, so cross-subdomain calls from
# web.aquilla.app are fine — see CORS_HEADERS in src/index.ts. Safari drops
# *.workers.dev WebSockets, which is why the API lives on a real zone and
# not the workers.dev URL. The worker strips the /identity or /chat prefix
# (index.ts) before handing off to the route handlers.
#
# =============================================================================
# ROUTE / ENV CONVENTION — read this before editing routes
# =============================================================================
# Routes for every environment live in `[env.<name>]` blocks below. This
# file IS the source of truth for routes — do NOT add or remove routes via
# the Cloudflare dashboard.
#
# Why the top-level config has no `routes` block:
#   CI's API token lacks `Zone.Workers Routes:Edit` on the aquilla.app zone,
#   so a routed deploy fails with auth error [10000]. CI runs bare
#   `wrangler deploy` (which uses this top-level config) and only ships CODE.
#
# Routes are applied by a LOCAL deploy with a zone-perm token:
#   pnpm run deploy:aquilla:auth        # = wrangler deploy --env=production
#   (cd auth-worker && wrangler deploy --env=staging)
# These commands sync the worker's routes to match the env block — they
# ADD routes new to the list and REMOVE routes that have been deleted.
#
# To add or change a route:
#   1. Edit `routes = [...]` in the relevant `[env.<name>]` below.
#   2. Run the deploy command above.
#   3. Commit the wrangler.toml change.
#
# Future state: when CI's token is upgraded with zone-route perms,
# `.github/workflows/deploy-workers.yml` can switch to
# `wrangler deploy --env=production`, after which routes ship on every push
# to main. Until then, route changes are a deliberate local step.
# =============================================================================
#
# Chat: /chat/* on api.aquilla.app is owned by this worker (folded in from
# the former aquilla-chat-worker on 2026-05-26 — same JWT secret, one
# worker). OPENROUTER_API_KEY must be set on aquilla-identity (and
# aquilla-dev-identity for staging) via `wrangler secret put`. The legacy
# `aquilla.app/api/chat/*` route still lives on codex-chat-worker; once
# this worker's `api.aquilla.app/chat/*` is verified the legacy route can
# be detached.

# auth-worker is the full identity surface and owns the complete schema
# (identity + orgs + projects + members + invites + file/cell projections).
# The datastore is Postgres (Neon), reached through the D1-compatible shim
# (db/shim/postgres.ts) over Hyperdrive — index.ts builds AQUILLA_PG from it.
# D1 has been removed as a datastore (the D1→Neon cutover is complete); the
# worker fails fast if HYPERDRIVE is absent rather than falling back to D1.
#
# Schema management is by hand against Neon, NOT D1 migrations:
#   set -a; . ./.env; set +a            # load Neon creds
#   npx tsx scripts/pg.ts db/postgres/schema.sql
# The legacy D1 files under `migrations/` are retained only as the historical
# record the Postgres schema was derived from. For local `wrangler dev`,
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE points Hyperdrive at a
# local/branch Postgres (see scripts/dev-stack.ts, scripts/e2e-up.ts).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

# Secrets (provisioned via `wrangler secret put`, never committed):
#   SECRET_KEY      — frontier JWT signing key. MUST match prod
#                     frontier-server so access tokens are interchangeable.
#   SYNC_SECRET_KEY — signs /sync-token JWTs. MUST match aquilla-sync-worker.
#   RESEND_API_KEY  — used by /password-reset/request to send email.
#   OPENROUTER_API_KEY — Bearer key forwarded by /api/v1/chat/completions
#                        to OpenRouter (folded in from aquilla-chat-worker).
# Plain vars: see types.ts for the full list.

[vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
# BASE_URL points at the SPA — used to construct password-reset / invite
# links sent in email. The apex aquilla.app is the canonical app domain.
BASE_URL = "https://aquilla.app"
SYNC_WORKER_URL = "https://api.aquilla.app/sync"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "production"
# Comma-separated username allowlist for the site-wide admin surface
# (/api/v2/admin/*). Separate axis from the org role ladder — see
# src/middleware/platform-admin.ts.
PLATFORM_ADMINS = "daniel2,dadukhankevin,ryder,ryder-aquilla,ryder-aquilla-2,ryder-aquilla-3"

# ---------------------------------------------------------------------------
# Production environment — owns routes on api.aquilla.app for the identity
# and chat surfaces. Same worker name as top-level (aquilla-identity), so
# `wrangler deploy` (CI, code-only) and `wrangler deploy --env=production`
# (local, code + routes) target the same Worker. Bindings + vars are
# re-declared because env blocks don't inherit them.
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-identity"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = [
  "api.aquilla.app/identity/*",
  "api.aquilla.app/chat/*",
]

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

[env.production.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
BASE_URL = "https://aquilla.app"
SYNC_WORKER_URL = "https://api.aquilla.app/sync"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "production"
PLATFORM_ADMINS = "daniel2,dadukhankevin,ryder,ryder-aquilla,ryder-aquilla-2,ryder-aquilla-3"

# ---------------------------------------------------------------------------
# Development environment — for the dev branch, deployed to api.dev.aquilla.app
# Physically separate Neon branch so experiments don't pollute prod identities.
# Same SECRET_KEY + SYNC_SECRET_KEY as prod so tokens minted against dev still
# verify against prod workers during cross-env testing.
# ---------------------------------------------------------------------------
[env.development]
name = "aquilla-dev-identity"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = [
  "api.dev.aquilla.app/identity/*",
  "api.dev.aquilla.app/chat/*",
]

# Dev runs on Neon (Postgres) to mirror prod. index.ts builds AQUILLA_PG
# from the Postgres shim over Hyperdrive → the Neon `dev` branch.
#
# ONE-TIME PROVISIONING — create the dev Hyperdrive config, then paste its id
# below (replace the placeholder):
#   wrangler hyperdrive create aquilla-dev \
#     --connection-string="<neon dev branch pooled connection string>" \
#     --caching-disabled
[[env.development.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_DEV_HYPERDRIVE_ID"

[env.development.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
BASE_URL = "https://dev.aquilla.app"
SYNC_WORKER_URL = "https://api.dev.aquilla.app/sync"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "development"
PLATFORM_ADMINS = "daniel2,dadukhankevin,ryder,ryder-aquilla,ryder-aquilla-2,ryder-aquilla-3"

# ---------------------------------------------------------------------------
# Staging environment — for the staging branch, deployed to api.staging.aquilla.app
# Pre-production QA environment. Physically separate Neon branch so experiments
# don't pollute prod identities. Same SECRET_KEY + SYNC_SECRET_KEY as prod so
# tokens minted against staging still verify against prod workers.
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-staging-identity"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = [
  "api.staging.aquilla.app/identity/*",
  "api.staging.aquilla.app/chat/*",
]

# Staging runs on Neon (Postgres) to mirror prod. index.ts builds AQUILLA_PG
# from the Postgres shim over Hyperdrive → the Neon `staging` branch (project
# sweet-paper-88472094, branch br-old-credit-aja5brf7).
#
# ONE-TIME PROVISIONING (FRO-146) — create the staging Hyperdrive config, then
# paste its id below (replace the placeholder):
#   wrangler hyperdrive create aquilla-staging \
#     --connection-string="<neon staging branch pooled connection string>" \
#     --caching-disabled
# Get the pooled connection string from the Neon `staging` branch; keep it OUT of git.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_STAGING_HYPERDRIVE_ID"

[env.staging.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
BASE_URL = "https://dev.aquilla.app"
SYNC_WORKER_URL = "https://api.dev.aquilla.app/sync"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "staging"
PLATFORM_ADMINS = "daniel2,dadukhankevin,ryder,ryder-aquilla,ryder-aquilla-2,ryder-aquilla-3"

# ---------------------------------------------------------------------------
# e2e test environment. Local e2e (scripts/e2e-up.ts) runs `wrangler dev` on
# the DEFAULT profile and points Hyperdrive at a local Postgres via
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE — so it boots on
# Postgres, not D1. This [env.e2e] block only matters for a deployed
# `wrangler deploy --env e2e`; it needs its own Hyperdrive binding (Postgres is
# the only datastore now).
# ---------------------------------------------------------------------------
[env.e2e]
name = "aquilla-identity-e2e"

[[env.e2e.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_E2E_HYPERDRIVE_ID"

[env.e2e.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@local.test"
BASE_URL = "http://127.0.0.1:5173"
SYNC_WORKER_URL = "http://127.0.0.1:8788"
ENVIRONMENT = "development"
PLATFORM_ADMINS = "dev"
