name = "aquilla-identity"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Phase D: auth-worker is the full identity surface. AQUILLA_DB owns the
# complete schema (identity + orgs + projects + members + invites + file/cell
# projections). Migrations under `migrations/` are applied automatically on
# deploy — see the CI step that runs `wrangler d1 migrations apply aquilla-db`.
# Schema ownership lives here; sync-worker binds the same D1 but does NOT
# declare migrations_dir.
[[d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db"
database_id = "11828e9d-998b-4d3f-a405-91d9f624f94a"
migrations_dir = "migrations"

# Secrets (provisioned via `wrangler secret put`, never committed):
#   SECRET_KEY      — frontier JWT signing key. MUST match prod
#                     frontier-server so access tokens are interchangeable.
#   SYNC_SECRET_KEY — signs /sync-token JWTs. MUST match aquilla-sync-worker.
#   RESEND_API_KEY  — used by /password-reset/request to send email.
# Plain vars: see types.ts for the full list.

[vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
BASE_URL = "https://aquilla.app"
SYNC_WORKER_URL = "https://aquilla.app/api/sync"
ENVIRONMENT = "production"

# ---------------------------------------------------------------------------
# Staging environment — physically separate D1 (frontier-db-v2-staging) so
# experiments don't pollute prod identities. Same SECRET_KEY + SYNC_SECRET_KEY
# as prod so tokens minted against staging still verify against prod workers
# during cross-env testing (set via `wrangler secret put --env staging`).
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-dev-identity"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

[[env.staging.d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db-staging"
database_id = "c995bf9a-97c0-4966-a112-053a2d04d8f9"
migrations_dir = "migrations"

[env.staging.vars]
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "43200"
EMAIL_FROM = "noreply@aquilla.app"
BASE_URL = "https://dev.aquilla.app"
ENVIRONMENT = "staging"
