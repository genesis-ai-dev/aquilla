name = "aquilla-chat-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Authenticated proxy to OpenRouter for aquilla's LLM completion route.
# Verifies a frontier-style JWT (HS256, shared SECRET_KEY with aquilla-identity
# and the legacy frontier-server) against frontier-db-v2's `users` table, then
# forwards the request to OpenRouter. No billing / usage tracking lives here —
# aquilla doesn't need it, and keeping the worker small keeps the surface
# area easy to reason about.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "frontier-db-v2"
database_id = "9c6abd81-01c3-44ce-9d93-9dfa1c7e1086"

# Secrets (provisioned via `wrangler secret put`, never committed):
#   SECRET_KEY        — frontier JWT signing key. MUST match aquilla-identity
#                       (and the legacy frontier-server) so a single Bearer
#                       token works against both.
#   OPENROUTER_API_KEY — forwarded as Authorization: Bearer to OpenRouter.
# Plain vars (override via [vars]):
#   ALGORITHM            — JWT algorithm; HS256 to match the rest of the stack.
#   DEFAULT_LLM_MODEL    — used when the client sends "default" / "free-tier"
#                          / empty string, mirroring the legacy frontier-server.
#   ENVIRONMENT          — informational tag for logs.

[vars]
ALGORITHM = "HS256"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "production"

# ---------------------------------------------------------------------------
# Staging environment — physically separate D1 (frontier-db-v2-staging) so
# experiments don't pollute prod identities. Same SECRET_KEY as prod so tokens
# minted against staging still verify against prod workers during cross-env
# testing (set via `wrangler secret put --env staging`).
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-chat-worker-staging"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

[[env.staging.d1_databases]]
binding = "AUTH_DB"
database_name = "frontier-db-v2-staging"
database_id = "636fdec6-ba75-447f-b890-6743e00b95fe"

[env.staging.vars]
ALGORITHM = "HS256"
DEFAULT_LLM_MODEL = "anthropic/claude-sonnet-4.5"
ENVIRONMENT = "staging"
