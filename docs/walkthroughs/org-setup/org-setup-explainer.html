<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aquilla — create an organization &amp; change its settings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css" />
<style>
  :root{
    --bg:#f3f3ee; --surface:#ffffff; --surface2:#f7f6f1; --line:rgba(0,0,0,.12);
    --line2:rgba(0,0,0,.22); --text:#1b1b19; --muted:#5f5e5a; --hint:#88877f;
    --accent:#378add; --accent-soft:#e6f1fb; --accent-text:#0c447c;
    --radius:8px; --radius-lg:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1c1a; --surface:#262623; --surface2:#222220; --line:rgba(255,255,255,.14);
      --line2:rgba(255,255,255,.26); --text:#ece9e2; --muted:#a9a79f; --hint:#7d7c75;
      --accent:#85b7eb; --accent-soft:#0c2540; --accent-text:#b5d4f4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 40px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:20px;font-weight:500;margin:0}
  .phase{font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
  .app{position:relative;display:grid;grid-template-columns:210px 1fr;
    background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius-lg);
    overflow:hidden;min-height:420px}
  .side{background:var(--surface2);border-right:0.5px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:14px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
  .brand .logo{width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center}
  .orgsw{position:relative;width:100%;text-align:left;background:var(--surface);border:0.5px solid var(--line2);
    border-radius:var(--radius);padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:default}
  .orgsw .nm{font-size:13px;font-weight:500;line-height:1.2}
  .orgsw .ro{font-size:11px;color:var(--hint)}
  .nav{display:flex;flex-direction:column;gap:1px;margin-top:2px}
  .nav a{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:6px;text-decoration:none}
  .nav a.on{background:var(--surface);color:var(--text);border:0.5px solid var(--line)}
  .spacer{flex:1}
  .acct{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .acct .av{width:22px;height:22px;border-radius:50%;background:#7a2430;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  .main{padding:18px 20px;overflow:hidden}
  .crumb{font-size:12px;color:var(--hint);margin-bottom:14px}
  .crumb b{color:var(--muted);font-weight:500}
  h2{font-size:17px;font-weight:500;margin:0 0 14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .stat{background:var(--surface2);border-radius:var(--radius);padding:10px 12px}
  .stat .v{font-size:18px;font-weight:500}
  .stat .l{font-size:11px;color:var(--muted)}
  .card{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px}
  .card h3{font-size:14px;font-weight:500;margin:0 0 10px}
  .rowb{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .muted{color:var(--muted);font-size:13px}
  .hint{color:var(--hint);font-size:12px}
  .btn{font-size:13px;background:transparent;border:0.5px solid var(--line2);border-radius:var(--radius);
    padding:6px 12px;color:var(--text);cursor:default;white-space:nowrap}
  .btn.pri{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
  .inp{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--line2);border-radius:var(--radius);
    background:var(--surface);color:var(--text)}
  .field{font-size:11px;color:var(--muted);margin-bottom:5px}
  .sel{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;
    border:0.5px solid var(--line2);border-radius:var(--radius);padding:8px 10px;background:var(--surface);max-width:300px}
  .listbox{margin-top:6px;border:0.5px solid var(--line2);border-radius:var(--radius);background:var(--surface);
    padding:4px;max-width:300px}
  .opt{font-size:13px;padding:7px 9px;border-radius:6px;color:var(--muted)}
  .opt.sel{background:var(--surface2);color:var(--text)}
  .checklist .ci{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
  .checklist .ci .lt{display:flex;align-items:center;gap:9px;font-size:13px}
  .ring{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2)}
  .pop{position:absolute;left:12px;top:54px;width:186px;background:var(--surface);border:0.5px solid var(--line2);
    border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:5}
  .pop .item{font-size:13px;padding:7px 8px;border-radius:6px;color:var(--text);display:flex;justify-content:space-between}
  .pop .sub{font-size:11px;color:var(--hint)}
  .pop .row{display:flex;gap:6px;padding:6px 4px 2px}
  .pop .ti{flex:1;font-size:13px;padding:7px 8px;border:0.5px solid var(--line2);border-radius:6px}
  .hl{position:relative;z-index:6;animation:pulse 1.6s ease-in-out infinite;border-radius:var(--radius)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--accent),0 0 0 5px rgba(55,138,221,.18)}
    50%{box-shadow:0 0 0 2px var(--accent),0 0 0 9px rgba(55,138,221,.05)}}
  .cap{margin:16px 2px 4px;font-size:15px;min-height:44px}
  .cap .step{color:var(--accent);font-weight:500;margin-right:6px}
  .ctl{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
  .ctl button{font-size:13px;background:var(--surface);border:0.5px solid var(--line2);border-radius:var(--radius);
    padding:7px 14px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .ctl button:hover{background:var(--surface2)}
  .dots{display:flex;gap:6px;align-items:center;flex:1;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line2);cursor:pointer;border:none;padding:0}
  .dot.on{background:var(--accent)}
  .dot.sep{width:1px;height:14px;border-radius:0;background:var(--line);margin:0 4px;cursor:default}
  .credit{font-size:11px;color:var(--hint);margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Create a new organization &amp; change its settings</h1>
    <div class="phase" id="phase">Create an organization</div>
  </div>
  <div class="app" id="app"></div>
  <div class="cap" id="cap"></div>
  <div class="ctl">
    <div class="dots" id="dots"></div>
    <button id="prev"><i class="ti ti-arrow-left"></i> Back</button>
    <button id="play"><i class="ti ti-player-play"></i> Play</button>
    <button id="next">Next <i class="ti ti-arrow-right"></i></button>
  </div>
  <div class="credit">Stylized recreation of the Aquilla flow — see <code>org-setup-walkthrough.gif</code> for the real-app capture.</div>
</div>
<script>
const STEPS=[
 {phase:"Create an organization",cap:"Click the organization switcher at the top of the sidebar.",main:"home",org:"Dev Org",tg:"orgsw"},
 {phase:"Create an organization",cap:"In the menu, choose “+ Create org”.",main:"home",org:"Dev Org",pop:"switcher",tg:"createorg"},
 {phase:"Create an organization",cap:"Type the new organization’s name, then click Create.",main:"home",org:"Dev Org",pop:"create",val:"Northwind Bible Society",tg:"createbtn"},
 {phase:"Create an organization",cap:"It’s created and becomes your active org — with a get-started checklist.",main:"onboarding",org:"Northwind Bible Society"},
 {phase:"Change its settings",cap:"Open Settings from the sidebar, then click Rename in the Identity card.",main:"settings",org:"Northwind Bible Society",nav:"Settings",tg:"rename"},
 {phase:"Change its settings",cap:"Edit the name and click Save.",main:"settings",org:"Northwind Bible Society",edit:true,val:"Northwind Bible Society (Kenya)",nav:"Settings",tg:"save"},
 {phase:"Change its settings",cap:"The new name saves and propagates to the sidebar and breadcrumb at once.",main:"settings",org:"Northwind Bible Society (Kenya)",nav:"Settings"},
 {phase:"Change its settings",cap:"Set “Who can export” — the minimum role allowed to download deliverables.",main:"settings",org:"Northwind Bible Society (Kenya)",exportOpen:true,nav:"Settings",tg:"export"},
 {phase:"Change its settings",cap:"The export floor is now Contributor (400). Settings save on the spot.",main:"settings",org:"Northwind Bible Society (Kenya)",exportVal:"Contributor (400)",nav:"Settings"},
];
const EXPORT_OPTS=["Viewer (100)","Contributor (400)","Project lead (500)","Maintainer (600) — default","Owner (700)"];
let i=0,timer=null;

function side(s){
  const nav=["Projects","Teams","Assigned to me","Members","Archived","Settings"]
    .map(n=>`<a class="${s.nav===n?'on':''}">${n}</a>`).join("");
  return `<div class="side">
    <div class="brand"><span class="logo"><i class="ti ti-book"></i></span>Aquilla</div>
    <button class="orgsw" data-tg="orgsw"><span><span class="nm">${s.org}</span><br><span class="ro">owner</span></span><i class="ti ti-selector" style="color:var(--hint)"></i></button>
    <div class="nav">${nav}</div>
    <div class="spacer"></div>
    <div class="acct"><span class="av">DE</span>dev</div>
  </div>`;
}
function popover(s){
  if(s.pop==="switcher") return `<div class="pop">
    <div class="item">${s.org}<i class="ti ti-check" style="color:var(--accent)"></i></div>
    <div class="item">Rename</div>
    <div class="item" data-tg="createorg" style="color:var(--accent-text)">+ Create org</div></div>`;
  if(s.pop==="create") return `<div class="pop">
    <div class="item">${s.org}</div>
    <div class="item">Rename</div>
    <div class="row"><span class="ti">${s.val}</span><button class="btn pri" data-tg="createbtn" style="padding:6px 10px">Create</button></div></div>`;
  return "";
}
function home(s){
  return `<div class="crumb"><b>All organizations</b> &rsaquo; ${s.org}</div>
    <h2>${s.org}</h2>
    <div class="stats">
      <div class="stat"><div class="v">4</div><div class="l">Projects</div></div>
      <div class="stat"><div class="v">9%</div><div class="l">Avg translated</div></div>
      <div class="stat"><div class="v">0%</div><div class="l">Avg validated</div></div>
      <div class="stat"><div class="v">0%</div><div class="l">Avg audio</div></div>
    </div>
    <div class="card"><div class="rowb"><span class="muted">Dev Project &middot; owner</span><span class="hint">0% translated</span></div></div>`;
}
function onboarding(s){
  return `<div class="crumb"><b>All organizations</b> &rsaquo; ${s.org}</div>
    <h2>${s.org}</h2>
    <div class="card checklist">
      <h3>Get your organization started</h3>
      <div class="hint" style="margin-bottom:6px">0 of 2 complete</div>
      <div class="ci"><span class="lt"><span class="ring"></span>Create your first project</span><button class="btn">+ New Project</button></div>
      <div class="ci"><span class="lt"><span class="ring"></span>Invite a teammate</span><button class="btn"><i class="ti ti-user-plus"></i> Invite</button></div>
    </div>
    <div class="card" style="text-align:center"><div style="font-weight:500;margin-bottom:4px">Your organization is ready</div>
      <div class="muted">Start a translation project, or bring your team in first.</div></div>`;
}
function settings(s){
  const ident = s.edit
    ? `<div class="field">Organization name</div><input class="inp" value="${s.val}" style="margin-bottom:10px"/>
       <div style="display:flex;gap:8px"><button class="btn pri" data-tg="save">Save</button><button class="btn">Cancel</button></div>`
    : `<div class="rowb"><div><div style="font-weight:500">${s.org}</div><div class="hint">Your role: owner</div></div>
       <button class="btn" data-tg="rename">Rename</button></div>`;
  const cur = s.exportVal || "Maintainer (600) — default";
  const exportBlock = s.exportOpen
    ? `<div class="sel"><span>${cur}</span><i class="ti ti-chevron-down" style="color:var(--hint)"></i></div>
       <div class="listbox" data-tg="export">${EXPORT_OPTS.map(o=>`<div class="opt ${o==='Contributor (400)'?'sel':''}">${o}</div>`).join("")}</div>`
    : `<div class="sel"><span>${cur}</span><i class="ti ti-chevron-down" style="color:var(--hint)"></i></div>`;
  return `<div class="crumb"><b>${s.org}</b> &rsaquo; Settings</div>
    <h2>Organization settings</h2>
    <div class="card"><h3>Identity</h3>${ident}</div>
    <div class="card"><h3>Export permissions</h3>
      <div class="muted" style="margin-bottom:10px;font-size:12px">Minimum role required to download project deliverables.</div>
      <div class="field">Who can export</div>${exportBlock}</div>`;
}
function mainHtml(s){
  if(s.main==="onboarding") return onboarding(s);
  if(s.main==="settings") return settings(s);
  return home(s);
}
function render(){
  const s=STEPS[i];
  document.getElementById("phase").textContent=s.phase;
  document.getElementById("app").innerHTML = side(s) + `<div class="main">${mainHtml(s)}</div>` + popover(s);
  document.getElementById("cap").innerHTML = `<span class="step">Step ${i+1} of ${STEPS.length}</span>${s.cap}`;
  if(s.tg){const el=document.querySelector(`[data-tg="${s.tg}"]`); if(el) el.classList.add("hl");}
  document.querySelectorAll(".dot").forEach((d,k)=>d.classList.toggle("on",k===i));
}
function go(n){i=(n+STEPS.length)%STEPS.length;render();}
function stop(){if(timer){clearInterval(timer);timer=null;document.getElementById("play").innerHTML='<i class="ti ti-player-play"></i> Play';}}
function play(){
  if(timer){stop();return;}
  document.getElementById("play").innerHTML='<i class="ti ti-player-pause"></i> Pause';
  timer=setInterval(()=>{ if(i===STEPS.length-1){stop();return;} go(i+1); },2600);
}
const dots=document.getElementById("dots");
STEPS.forEach((s,k)=>{
  if(k===4){const sep=document.createElement("span");sep.className="dot sep";dots.appendChild(sep);}
  const b=document.createElement("button");b.className="dot";b.onclick=()=>{stop();go(k);};dots.appendChild(b);
});
document.getElementById("prev").onclick=()=>{stop();go(i-1);};
document.getElementById("next").onclick=()=>{stop();go(i+1);};
document.getElementById("play").onclick=play;
render();
</script>
</body>
</html>
