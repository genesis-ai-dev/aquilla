<!doctype html>
<!--
  agentic-compose.html — deterministic kinetic-type cards for the XITL promo.

  A pure function of time, like compose.html: montage.ts loads this file, sets
  window.__CARD = { kind, ...copy, dur } and window.__APP_FRAMES (optional real
  stills), then calls window.__seek(t) per frame and screenshots. No rAF / CSS
  transitions carry state — every pixel derives from t, so frame N is identical
  every run and never drops.

  Card kinds: "hook" | "crossout" | "progress" | "multimodal" | "cta"
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #05070d; overflow: hidden;
        font-family: Inter, system-ui, -apple-system, sans-serif; }
      #stage { position: fixed; inset: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .layer { position: absolute; inset: 0; }
      .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
      #bug { position: absolute; right: 54px; top: 44px; font-size: 22px; font-weight: 800;
        letter-spacing: .18em; color: #cfe0ff; opacity: .55; }
      .vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.55)); }

      /* generic type */
      #title { font-size: 96px; font-weight: 800; letter-spacing: -.025em; color: #f4f8ff;
        text-shadow: 0 6px 40px rgba(0,0,0,.5); line-height: 1.02; max-width: 1500px; }
      #subtitle { font-size: 40px; font-weight: 500; color: #9fb6d6; margin-top: 22px; letter-spacing: -.01em; }

      /* crossout */
      #co { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
      #co .old { position: relative; font-size: 78px; font-weight: 800; letter-spacing: -.02em; color: #7d8ba3; }
      #co .strike { position: absolute; left: 0; top: 50%; height: 8px; border-radius: 8px;
        background: linear-gradient(90deg,#ff6b6b,#ff8f5a); box-shadow: 0 0 24px rgba(255,120,90,.5); }
      #co .new { font-size: 104px; font-weight: 900; letter-spacing: -.03em; margin-top: 34px;
        background: linear-gradient(90deg,#8fc0ff,#fff 55%,#c9a6ff); -webkit-background-clip: text;
        background-clip: text; color: transparent; text-shadow: 0 8px 50px rgba(120,160,255,.25); }
      #co .kicker { font-size: 26px; letter-spacing: .28em; text-transform: uppercase; color: #7f96bb; margin-bottom: 26px; }

      /* progress */
      #pg { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
      #pg .pct { font-size: 200px; font-weight: 900; letter-spacing: -.04em; color: #eaf2ff;
        font-variant-numeric: tabular-nums; }
      #pg .bar { width: 900px; height: 26px; border-radius: 999px; background: #16202f;
        margin: 26px auto 0; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
      #pg .fill { height: 100%; border-radius: 999px; width: 0%;
        background: linear-gradient(90deg,#f4b740,#f4b740); }
      #pg .lab { font-size: 34px; font-weight: 600; color: #a9bfe0; margin-top: 34px; letter-spacing: -.01em; }

      /* multimodal chips */
      #mm { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
      #mm .mt { font-size: 84px; font-weight: 800; letter-spacing: -.02em; color: #f4f8ff; }
      #mm .row { display: flex; gap: 34px; justify-content: center; margin-top: 54px; }
      #mm .chip { display: flex; align-items: center; gap: 16px; padding: 24px 40px; border-radius: 999px;
        background: linear-gradient(180deg,#141c2b,#0e1420); border: 1px solid rgba(140,175,255,.22);
        font-size: 44px; font-weight: 700; color: #dbe7ff; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
      #mm .chip .ic { width: 46px; height: 46px; display: grid; place-content: center; border-radius: 12px;
        font-size: 30px; }
      #mm .chip.t .ic { background: rgba(140,175,255,.18); color: #9fc0ff; }
      #mm .chip.a .ic { background: rgba(120,230,180,.16); color: #77e6b4; }
      #mm .chip.v .ic { background: rgba(201,166,255,.18); color: #c9a6ff; }

      /* cta */
      #cta { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
      #cta .word { font-size: 176px; font-weight: 900; letter-spacing: -.03em;
        background: linear-gradient(90deg,#8fc0ff,#fff 60%,#c9a6ff); -webkit-background-clip: text;
        background-clip: text; color: transparent; }
      #cta .tag { font-size: 34px; color: #aebfdd; letter-spacing: .28em; margin-top: 14px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="bg"></canvas>
      <div class="layer vignette"></div>

      <div id="type" class="center"><div><div id="title"></div><div id="subtitle"></div></div></div>

      <div id="co" style="display:none">
        <div>
          <div class="kicker"></div>
          <div class="old"><span class="oldtext"></span><span class="strike"></span></div>
          <div class="new"></div>
        </div>
      </div>

      <div id="pg" style="display:none">
        <div>
          <div class="pct">83%</div>
          <div class="bar"><div class="fill"></div></div>
          <div class="lab"></div>
        </div>
      </div>

      <div id="mm" style="display:none">
        <div>
          <div class="mt"></div>
          <div class="row">
            <div class="chip t"><span class="ic">¶</span><span>Text</span></div>
            <div class="chip a"><span class="ic">♪</span><span>Audio</span></div>
            <div class="chip v"><span class="ic">▶</span><span>Video</span></div>
          </div>
        </div>
      </div>

      <div id="cta" style="display:none"><div><div class="word"></div><div class="tag"></div></div></div>

      <div id="bug"></div>
    </div>
    <script>
      const CARD = window.__CARD || { kind: "hook", title: "Aquilla", subtitle: "", dur: 3.5, brand: "AQUILLA", width: 1920, height: 1080 }
      const W = CARD.width || 1920, H = CARD.height || 1080
      window.__DURATION = CARD.dur || 3.5
      window.__FPS = CARD.fps || 30

      const stage = document.getElementById("stage")
      stage.style.width = W + "px"; stage.style.height = H + "px"
      const cv = document.getElementById("bg"); cv.width = W; cv.height = H
      const ctx = cv.getContext("2d")
      document.getElementById("bug").textContent = CARD.brand || "AQUILLA"

      const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x))
      const ramp = (x, a, b) => { if (x <= a) return 0; if (x >= b) return 1; const u = (x - a) / (b - a); return u * u * (3 - 2 * u) }
      const lerp = (a, b, u) => a + (b - a) * u
      const easeOut = (u) => 1 - Math.pow(1 - clamp(u), 3)
      const rnd = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s) }

      function drawBg(t) {
        const g = ctx.createLinearGradient(0, 0, W, H)
        const hue = 218 + 10 * Math.sin(t * 0.5)
        g.addColorStop(0, `hsl(${hue},45%,7%)`)
        g.addColorStop(0.5, `hsl(${hue + 8},55%,5%)`)
        g.addColorStop(1, `hsl(${hue - 14},50%,4%)`)
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
        const gx = W * (0.5 + 0.16 * Math.sin(t * 0.4))
        const gy = H * (0.42 + 0.1 * Math.cos(t * 0.33))
        const rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, W * 0.55)
        rg.addColorStop(0, "rgba(80,130,255,0.16)"); rg.addColorStop(1, "rgba(80,130,255,0)")
        ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H)
        ctx.save()
        for (let i = 0; i < 40; i++) {
          const seed = rnd(i)
          const speed = 14 + rnd(i + 50) * 30
          const x = (rnd(i + 7) * W + t * speed) % W
          const y = (rnd(i + 99) * H + t * speed * 0.3) % H
          const r = 1.0 + rnd(i + 3) * 2.2
          ctx.globalAlpha = 0.06 + seed * 0.12
          ctx.fillStyle = "#9cc2ff"
          ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill()
        }
        ctx.restore()
      }

      const els = {
        type: document.getElementById("type"), title: document.getElementById("title"),
        sub: document.getElementById("subtitle"),
        co: document.getElementById("co"), pg: document.getElementById("pg"),
        mm: document.getElementById("mm"), cta: document.getElementById("cta"),
      }
      function only(id) {
        for (const k of ["type", "co", "pg", "mm", "cta"]) {
          els[k].style.display = (k === id) ? (k === "type" ? "grid" : "grid") : "none"
        }
      }

      function seek(t) {
        t = clamp(t, 0, window.__DURATION)
        drawBg(t)
        const inO = easeOut(t / 0.55)
        const outO = 1 - ramp(t, window.__DURATION - 0.4, window.__DURATION)

        if (CARD.kind === "crossout") {
          only("co")
          els.co.querySelector(".kicker").textContent = CARD.kicker || "The old way"
          els.co.querySelector(".oldtext").textContent = CARD.old || "Human in the loop"
          els.co.querySelector(".new").textContent = CARD.new || "Expert in the lead"
          const kick = els.co.querySelector(".kicker")
          const oldEl = els.co.querySelector(".old")
          const strike = els.co.querySelector(".strike")
          const neu = els.co.querySelector(".new")
          kick.style.opacity = String(clamp(inO) * outO)
          oldEl.style.opacity = String(clamp(easeOut(t / 0.5)) * outO)
          // strike sweeps 1.1s→1.9s
          const sw = ramp(t, 1.1, 1.9)
          strike.style.width = (oldEl.getBoundingClientRect().width * sw) + "px"
          strike.style.opacity = String(sw * outO)
          // "old" desaturates/dims as it's struck
          oldEl.style.color = `rgb(${lerp(125,90,sw)},${lerp(139,96,sw)},${lerp(163,110,sw)})`
          // new reveals after strike
          const nv = ramp(t, 2.0, 2.7)
          neu.style.opacity = String(nv * outO)
          neu.style.transform = `translateY(${lerp(26,0,nv)}px)`
          neu.style.letterSpacing = lerp(0.02, -0.03, nv) + "em"
          return
        }

        if (CARD.kind === "progress") {
          only("pg")
          const from = CARD.from ?? 83, to = CARD.to ?? 100
          const p = easeOut(ramp(t, 0.5, 2.1))
          const val = Math.round(lerp(from, to, p))
          const pct = els.pg.querySelector(".pct")
          const fill = els.pg.querySelector(".fill")
          const lab = els.pg.querySelector(".lab")
          pct.textContent = val + "%"
          pct.style.opacity = String(clamp(inO) * outO)
          fill.style.width = lerp(from, to, p) + "%"
          // amber → emerald as it completes
          const done = ramp(t, 1.9, 2.3)
          const c1 = `rgb(${lerp(244,52,done)},${lerp(183,211,done)},${lerp(64,153,done)})`
          fill.style.background = `linear-gradient(90deg, ${c1}, ${c1})`
          pct.style.color = done > 0.5 ? "#8ff0c2" : "#eaf2ff"
          lab.textContent = CARD.label || "The agent drafts. You approve."
          lab.style.opacity = String(ramp(t, 0.7, 1.3) * outO)
          els.pg.querySelector(".bar").style.opacity = String(clamp(inO) * outO)
          return
        }

        if (CARD.kind === "multimodal") {
          only("mm")
          els.mm.querySelector(".mt").textContent = CARD.title || "Multimodal by design"
          els.mm.querySelector(".mt").style.opacity = String(clamp(inO) * outO)
          const chips = els.mm.querySelectorAll(".chip")
          chips.forEach((c, i) => {
            const cv = easeOut(ramp(t, 0.5 + i * 0.35, 1.1 + i * 0.35))
            c.style.opacity = String(cv * outO)
            c.style.transform = `translateY(${lerp(24,0,cv)}px) scale(${lerp(0.9,1,cv)})`
          })
          return
        }

        if (CARD.kind === "cta") {
          only("cta")
          const u = easeOut(ramp(t, 0.15, 0.9))
          els.cta.querySelector(".word").textContent = CARD.word || "Aquilla"
          els.cta.querySelector(".tag").textContent = CARD.tag || "Expert in the lead"
          els.cta.style.opacity = String(clamp(u) * outO)
          els.cta.querySelector(".word").style.transform = `scale(${lerp(0.86,1,u)})`
          return
        }

        // default: hook / generic title card
        only("type")
        els.title.textContent = CARD.title || ""
        els.sub.textContent = CARD.subtitle || ""
        const y = lerp(40, 0, inO) + (1 - outO) * -26
        els.type.style.opacity = String(clamp(inO) * outO)
        els.type.querySelector("div").style.transform = `translateY(${y}px)`
        els.title.style.letterSpacing = lerp(0.05, -0.025, inO) + "em"
        els.sub.style.opacity = String(ramp(t, 0.45, 1.0) * outO)
      }

      window.__seek = seek
      window.__ready = true
      seek(0)
    </script>
  </body>
</html>
