[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-deep-link = "2"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
url = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.7", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tauri-plugin-mcp-bridge = "0.13"
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

[features]
# Embedded WebDriver server for the e2e smoke suite (e2e/tauri/smoke.spec.ts). Debug-build-only
# test harness — must never be enabled for the signed release binary tauri-action publishes.
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]
