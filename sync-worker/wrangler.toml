name = "codex-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# y-partyserver wires one Durable Object per file (room name = fileId).
[[durable_objects.bindings]]
name = "FileSync"
class_name = "FileSync"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

# R2 holds canonical Y.Doc snapshots and tail updates.
# Key layout: projects/{projectId}/files/{fileId}/{snapshot.bin,tail/{seq}.bin,checkpoints/{id}.bin}
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "codex-snapshots"
# For local `wrangler dev`, wrangler will use a local simulator if the bucket doesn't exist.

# Auth:
#   SECRET_KEY and ALLOW_UNAUTHENTICATED live in .dev.vars for local dev
#   (see .dev.vars.example) and are provisioned via `wrangler secret put`
#   in production. Deploying with neither set means strict auth (reject all
#   WS connections without a valid sync-token JWT) — that's the intended
#   prod default. If you need to disable auth in prod for some reason, set
#   ALLOW_UNAUTHENTICATED="true" via `wrangler secret put`.
