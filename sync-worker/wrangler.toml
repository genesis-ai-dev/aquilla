# The unnamed profile is local-only. Live deploys must select a named profile;
# a bare `wrangler deploy` therefore cannot overwrite the production Worker.
name = "aquilla-sync-worker-local"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Keep the *.workers.dev subdomain enabled (the SPA calls it directly) — a
# routed deploy would otherwise disable it.
workers_dev = true

# Same CF account as every Aquilla worker. This must remain a top-level key:
# placing it after `[vars]` silently turns it into a worker environment variable.
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Top-level vars serve LOCAL `wrangler dev` (scripts/dev-stack.ts, e2e-up.ts —
# both run the default profile). Deployed envs re-declare below (no inherit).
[vars]
ENVIRONMENT = "local"
# Identity worker base URL for the Monday-integration push nudge
# (src/monday-notify.ts). Local dev stack runs identity on 8788.
AUTH_WORKER_URL = "http://127.0.0.1:8788"

# =============================================================================
# ROUTE / ENV CONVENTION — same pattern as auth-worker
# =============================================================================
# Routes live in `[env.production]` and `[env.development]` below. This file is
# the source of truth — don't add or remove routes via the Cloudflare
# dashboard. GitHub Actions always passes an explicit named environment.
# Cloudflare Workers Builds calls `pnpm run deploy:workers-build`, which
# promotes `main` with production bindings and uploads preview-only versions
# for every other branch. Routes can also be applied by a LOCAL deploy:
#
#   pnpm run deploy:aquilla:sync        # = wrangler deploy --env=production
#   (cd sync-worker && wrangler deploy --env=development)
#
# To change a route: edit `routes` in the relevant `[env.<name>]`, run the
# deploy command, commit the wrangler.toml change. See
# auth-worker/wrangler.toml for the full convention doc.
# =============================================================================

# Per-project DO (Phase 2c). Holds focus locks + presence + an event-fanout
# relay. Transient state only; no D1/R2 writes from inside the DO itself.
[[durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

# R2 holds media blobs only (audio recordings, generated voice files).
# Key layout: projects/{projectId}/cells/{cellId}/audio/{audioId}.{ext}
# There are no Y.Doc snapshots, tail updates, or compaction artifacts here.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"
# For local `wrangler dev`, wrangler will use a local simulator if the bucket doesn't exist.

# Read-only source for the fast audio import (/migrate/audio-copy): the bucket
# that backs GitLab LFS (same CF account), keyed by LFS oid. Copying from here to
# SNAPSHOTS happens inside Cloudflare's network — no GitLab egress. Only the
# audio-copy route reads it; nothing in the worker writes to it.
[[r2_buckets]]
binding = "LFS_SRC"
bucket_name = "codex-attachments-v1-1"

# Datastore: Postgres (Neon) via Hyperdrive. index.ts builds AQUILLA_PG from the
# Postgres-backed shim (db/shim/postgres.ts) over this binding — there is no
# D1 datastore (the D1→Neon cutover is complete). The worker fails fast if this
# binding is absent rather than falling back to D1. For local `wrangler dev`,
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE points it at a local/
# branch Postgres (see scripts/dev-stack.ts, scripts/e2e-up.ts).
# Caching is disabled on the Hyperdrive config so live edits aren't served stale.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

# AD-13 branching-search KV result cache (optional — see lib/branching-search/cache.ts).
# Provision: `wrangler kv:namespace create BRANCHING_SEARCH_KV`
# Until provisioned, the cache binding is absent and the route runs fresh every request.
# [[kv_namespaces]]
# binding = "BRANCHING_SEARCH_KV"
# id = "<prod-namespace-id>"

# Auth:
#   SYNC_SECRET_KEY (shared with auth-worker for sync-token verification and
#   distinct from the identity access-token SECRET_KEY) and ALLOW_UNAUTHENTICATED live in
#   .dev.vars for local dev (see .dev.vars.example) and are provisioned via
#   `wrangler secret put` in production. Deploying with neither set means
#   strict auth (reject all WS connections without a valid sync-token JWT)
#   — the intended prod default. If you need to disable auth in prod for
#   some reason, set ALLOW_UNAUTHENTICATED="true" via `wrangler secret put`.

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production environment — routes traffic via api.aquilla.app/sync/* so
# Safari (which blocks *.workers.dev WebSockets) hits the real zone, and so
# the API surface lives on its own subdomain independent of the web app.
# Pre-migration this was mounted at aquilla.app/api/sync/*; the path-strip
# in src/index.ts (APEX_PREFIX) handles the new shape transparently.
# GitHub Actions and local scripts deploy this route through the explicit
# production profile. A route-permission failure must remain a failed deploy.
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-sync-worker"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["api.aquilla.app/sync/*"]

[env.production.build]
command = "bash ../scripts/verify-deploy-branch.sh main"

# Observability is NOT inherited from the top-level block by named envs —
# without this, production has Workers Logs disabled and 4xx/5xx are invisible.
[env.production.observability]
enabled = true

[env.production.vars]
ENVIRONMENT = "production"
# PostHog *project* token (public — same one shipped in the SPA bundle).
# Enables 4xx/5xx log shipping to PostHog Logs (src/posthog-logs.ts).
POSTHOG_KEY = "phc_oTksJRNEdLEaLD4wmdd2XcR4xaR4n52eA5VGDytW55Ln"
# Identity worker base for the Monday-integration push nudge (monday-notify.ts).
AUTH_WORKER_URL = "https://api.aquilla.app/identity"

[[env.production.durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

[[env.production.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"

# Read-only LFS source for /migrate/audio-copy (see top-level binding).
[[env.production.r2_buckets]]
binding = "LFS_SRC"
bucket_name = "codex-attachments-v1-1"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

# Cloudflare Email Service binding for comment notification emails. The sending
# domain (EMAIL_FROM, default noreply@support.aquilla.app) must be onboarded under
# Compute > Email Service > Email Sending (Frontier R&D account). Absent from
# the e2e env so local/e2e keep email a no-op.
[[env.production.send_email]]
name = "EMAIL"

# ---------------------------------------------------------------------------
# Development environment — for the dev branch, deployed to api.dev.aquilla.app
# Physically separate R2, DO namespace. Auth model unchanged: same SYNC_SECRET_KEY
# as prod. A logged-in user can use the dev frontend and their writes land in
# aquilla-snapshots-dev, leaving prod data untouched.
#
# Deploy: `wrangler deploy --env development` (CI does this on push to dev).
# Secrets: after first deploy, copy SYNC_SECRET_KEY from prod with
#   `wrangler secret put SYNC_SECRET_KEY --env development`
# ---------------------------------------------------------------------------
[env.development]
name = "aquilla-sync-worker-dev"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["api.dev.aquilla.app/sync/*"]

[env.development.vars]
ENVIRONMENT = "development"
# Identity worker base for the Monday-integration push nudge (monday-notify.ts).
AUTH_WORKER_URL = "https://api.dev.aquilla.app/identity"

[[env.development.durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[env.development.migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

[[env.development.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots-dev"

# Read-only LFS source for /migrate/audio-copy. Same prod LFS bucket — legacy
# audio lives in exactly one place — so a dev trial run can copy into
# aquilla-snapshots-dev for verification without touching prod media.
[[env.development.r2_buckets]]
binding = "LFS_SRC"
bucket_name = "codex-attachments-v1-1"

# Dev runs on Neon (Postgres) to mirror prod. index.ts builds AQUILLA_PG
# from the Postgres shim (db/shim/postgres.ts) over Hyperdrive → the Neon
# `dev` branch (project sweet-paper-88472094, branch dev).
# Caching disabled so live edits aren't served stale (same as prod).
#
# Create the dev Hyperdrive config, then paste its id below:
#   wrangler hyperdrive create aquilla-dev \
#     --connection-string="<neon dev branch pooled connection string>" \
#     --caching-disabled
[[env.development.hyperdrive]]
binding = "HYPERDRIVE"
id = "53581197ff7a4202a5ed0ef08537d4a6"

[[env.development.send_email]]
name = "EMAIL"
[env.e2e]
name = "aquilla-sync-worker-e2e"

[[env.e2e.durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[env.e2e.migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[env.e2e.migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

[[env.e2e.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"

[[env.e2e.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_E2E_HYPERDRIVE_ID"
