name = "aquilla-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Keep the *.workers.dev subdomain enabled (the SPA calls it directly) — a
# routed deploy would otherwise disable it.
workers_dev = true

# =============================================================================
# ROUTE / ENV CONVENTION — same pattern as auth-worker
# =============================================================================
# Routes live in `[env.production]` and `[env.staging]` below. This file is
# the source of truth — don't add or remove routes via the Cloudflare
# dashboard. CI's token lacks zone-route perms so CI runs bare
# `wrangler deploy` (top-level, code only). Routes are applied by a LOCAL
# deploy with a zone-perm token:
#
#   pnpm run deploy:aquilla:sync        # = wrangler deploy --env=production
#   (cd sync-worker && wrangler deploy --env=staging)
#
# To change a route: edit `routes` in the relevant `[env.<name>]`, run the
# deploy command, commit the wrangler.toml change. See
# auth-worker/wrangler.toml for the full convention doc.
# =============================================================================

# Same CF account as frontier-server and aquilla-db. Pinned so `wrangler deploy`
# doesn't prompt interactively and lands on the wrong account by accident.
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"

# Per-project DO (Phase 2c). Holds focus locks + presence + an event-fanout
# relay. Transient state only; no D1/R2 writes from inside the DO itself.
[[durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

# R2 holds media blobs only (audio recordings, generated voice files).
# Key layout: projects/{projectId}/cells/{cellId}/audio/{audioId}.{ext}
# There are no Y.Doc snapshots, tail updates, or compaction artifacts here.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"
# For local `wrangler dev`, wrangler will use a local simulator if the bucket doesn't exist.

# Shared D1 with frontier-server. Schema owned there (cloudflare/codex_migrations);
# sync-worker is a writer only (projects files + cells on every onSave).
[[d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db"
database_id = "11828e9d-998b-4d3f-a405-91d9f624f94a"

# D1→Neon migration: when HYPERDRIVE is bound, index.ts replaces the AQUILLA_DB
# D1 handle with a Postgres-backed shim (db/shim/d1-postgres.ts) over Hyperdrive
# → Neon. The D1 binding above is kept for rollback (drop this block to revert).
# Caching is disabled on the Hyperdrive config so live edits aren't served stale.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

# AD-13 branching-search KV result cache (optional — see lib/branching-search/cache.ts).
# Provision: `wrangler kv:namespace create BRANCHING_SEARCH_KV`
# Until provisioned, the cache binding is absent and the route runs fresh every request.
# [[kv_namespaces]]
# binding = "BRANCHING_SEARCH_KV"
# id = "<prod-namespace-id>"

# Auth:
#   SYNC_SECRET_KEY (shared with frontier-server for JWT signing — distinct
#   from Frontier's main SECRET_KEY) and ALLOW_UNAUTHENTICATED live in
#   .dev.vars for local dev (see .dev.vars.example) and are provisioned via
#   `wrangler secret put` in production. Deploying with neither set means
#   strict auth (reject all WS connections without a valid sync-token JWT)
#   — the intended prod default. If you need to disable auth in prod for
#   some reason, set ALLOW_UNAUTHENTICATED="true" via `wrangler secret put`.

# ---------------------------------------------------------------------------
# Production environment — routes traffic via api.aquilla.app/sync/* so
# Safari (which blocks *.workers.dev WebSockets) hits the real zone, and so
# the API surface lives on its own subdomain independent of the web app.
# Pre-migration this was mounted at aquilla.app/api/sync/*; the path-strip
# in src/index.ts (APEX_PREFIX) handles the new shape transparently.
# NOTE: CI strips `routes` lines before deploying (its token lacks
# zone-route perms). Routes are created out-of-band via CF dashboard or
# local `wrangler deploy --env production`.
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-sync-worker"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["api.aquilla.app/sync/*"]

[[env.production.durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

[[env.production.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots"

[[env.production.d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db"
database_id = "11828e9d-998b-4d3f-a405-91d9f624f94a"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "69bcc10e67464f2eaf4fe91a9141e7cd"

# ---------------------------------------------------------------------------
# Staging environment — physically separate D1, R2, DO namespace.
# Auth model unchanged: same SYNC_SECRET_KEY as prod, same frontier-server
# issues sync-tokens. A logged-in user can use the staging frontend and
# their writes land in aquilla-db-staging / aquilla-snapshots-staging, leaving
# prod data untouched.
#
# Deploy: `wrangler deploy --env staging` (CI does this on push to dev).
# Secrets: after first deploy, copy SYNC_SECRET_KEY from prod with
#   `wrangler secret put SYNC_SECRET_KEY --env staging`
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-sync-worker-staging"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
routes = ["api.dev.aquilla.app/sync/*"]

[[env.staging.durable_objects.bindings]]
name = "ProjectSync"
class_name = "ProjectSync"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["FileSync"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectSync"]

[[env.staging.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "aquilla-snapshots-staging"

[[env.staging.d1_databases]]
binding = "AQUILLA_DB"
database_name = "aquilla-db-staging"
database_id = "c995bf9a-97c0-4966-a112-053a2d04d8f9"
