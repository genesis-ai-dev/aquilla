# BETA_FLAG — build-time toggle (VITE_BETA_FLAG).
# Defaults to "1" (badge visible). To disable the beta badge, build with:
#   VITE_BETA_FLAG=0 pnpm deploy:aquilla:spa
# Or set VITE_BETA_FLAG=0 in CI env vars / Cloudflare Pages build settings.

# aquilla-web — Workers-with-static-assets deploy of the SPA (aquilla brand).
#
# This replaces the `codex-web` Cloudflare Pages project for the aquilla brand.
# Other brands (codex, honeycomb, context) still ship via `wrangler pages deploy`
# from package.json — leave those alone until each brand is migrated.
#
# Account: Frontier R&D (6a80496d1e59948a9cbaa3c643ba81d7)
#
# Backend Workers (aquilla-identity, aquilla-sync-worker) are reached from
# the browser via Workers Routes on the api.aquilla.app subdomain (paths
# /identity/*, /sync/*, /chat/*). Cross-subdomain calls work because auth is
# bearer-token-only and both workers use `Access-Control-Allow-Origin: *`.
# No service bindings needed — the SPA fetch()es absolute URLs from
# VITE_AUTH_BASE / VITE_SYNC_WORKER_HOST / VITE_CHAT_BASE wired in deploy.yml.
#
# aquilla.app is the canonical app domain. web.aquilla.app is retired.
# Signed-out visitors see public/homepage.html; signed-in users go straight
# to the SPA via the aq_hint cookie check in worker/index.ts.
#
# =============================================================================
# ROUTE / ENV CONVENTION — same pattern as auth-worker / sync-worker
# =============================================================================
# Routes live in `[env.production]` below. This file is the source of truth
# — don't touch routes via the Cloudflare dashboard. CI's token lacks
# zone-route perms, so CI runs bare `wrangler deploy` (top-level config,
# code only). Routes are applied by a LOCAL deploy with a zone-perm token:
#
#   pnpm run deploy:aquilla:spa          # builds + deploys SPA, syncs routes
#   pnpm run deploy:aquilla:web          # umbrella: SPA + sync-worker + auth-worker
#
# To change a route: edit `routes` in `[env.production]`, run the deploy
# command, commit the wrangler.toml change. See auth-worker/wrangler.toml
# for the full convention doc.
# =============================================================================

name = "aquilla-web"
main = "worker/index.ts"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
compatibility_date = "2025-05-01"
workers_dev = true

[observability]
enabled = true

# Assets-only deploy: no `main` entry, Cloudflare serves dist/ directly.
# `single-page-application` rewrites unknown paths to /index.html (replaces
# the public/_redirects rule used under Pages).
#
# IMPORTANT: dist/_redirects must NOT be present at deploy time. Workers'
# static-assets parser rejects the `/* /index.html 200` SPA rule as an
# "infinite loop" (error 100324) — unlike Pages, which accepts it. The
# deploy:aquilla:spa script removes it post-build. public/_redirects stays
# so the legacy Pages deploys for other brands keep working.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Production environment — attaches aquilla.app/* to this Worker. web.aquilla.app is retired.
# Same worker name as top-level (aquilla-web), so CI's bare `wrangler deploy`
# and local `wrangler deploy --env=production` target the same Worker.
# `[env.production.assets]` re-declared because env blocks don't inherit
# the top-level assets binding.
# ---------------------------------------------------------------------------
[env.production]
name = "aquilla-web"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
workers_dev = true
routes = ["aquilla.app/*"]

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Development staging — served from dev branch, deploys to dev.aquilla.app
# Uses same Worker code; assets deploy is separate.
# Deploy: wrangler deploy --env=development
# ---------------------------------------------------------------------------
[env.development]
name = "aquilla-web-development"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
workers_dev = true
routes = ["dev.aquilla.app/*"]

[env.development.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Pre-production staging — served from staging branch, deploys to staging.aquilla.app
# Uses same Worker code; assets deploy is separate.
# Deploy: wrangler deploy --env=staging
# ---------------------------------------------------------------------------
[env.staging]
name = "aquilla-web-staging"
account_id = "6a80496d1e59948a9cbaa3c643ba81d7"
workers_dev = true
routes = ["staging.aquilla.app/*"]

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
